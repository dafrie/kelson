{{- include "kelson.authGate" . -}}
{{- if .Values.rbac.createDetectClusterRole }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kelson.fullname" . }}-detect
  labels:
    {{- include "kelson.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kelson.fullname" . }}-detect
subjects:
  - kind: ServiceAccount
    name: {{ include "kelson.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
