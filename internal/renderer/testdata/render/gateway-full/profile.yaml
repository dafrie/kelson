# A cluster that has everything: Gateway API AND an ingress class (Gateway
# API must win), cert-manager, Prometheus.
gatewayAPI:
  version: v1.6.0
  classes: [envoy]
ingressClasses:
  - { name: nginx, controller: k8s.io/ingress-nginx, default: true }
certManager:
  clusterIssuers: [letsencrypt-prod]
prometheus:
  serviceMonitor: true
  podMonitor: true
metricsServer: {}
cnpg: {}
