apiVersion: kelson.dev/v1alpha1
kind: Project
metadata:
  name: mailroom

# A queue system: one long-running worker and two cron components.
# Workload kinds are derived — no `kind:` needed anywhere here (docs/model.md).
spec:
  image: registry.acme.run/mailroom:2.0.7

  components:
    # A cache, not the queue. kelson renders a valkey component with
    # persistence off (docs/data-services.md), so anything whose loss is an
    # incident — the queue itself — belongs in Postgres; a dedupe set that can
    # be rebuilt from the queue belongs here. The distinction is the whole
    # design of the type (#98, ADR-0015).
    - name: seen
      kind: valkey
      preset: small
      # Without this the cache has no password and anything in the namespace can
      # read it. `auth` names a Secret — never a value — that kelson writes into
      # the operator's ACL user and into the binding below, so one credential
      # has two consumers and appears in no manifest. Write it first, per
      # environment:
      #   kelson secret set seen-auth --project mailroom --env <env> \
      #     --from-stdin password
      auth: { secret: seen-auth, key: password }

    - name: worker            # no port, no schedule → worker (Deployment)
      command: ["mailroom", "work"]
      replicas: { min: 2 }
      env:
        # The address is a plain value: a Service name and a port are not
        # credentials. The URI stays passwordless at every setting — a URI with
        # the password in it would be a secret value in a manifest — so an
        # authenticated client takes the two apart (docs/data-services.md).
        SEEN_URL: { from: { service: seen, key: uri } }
        SEEN_PASSWORD: { from: { service: seen, key: password } }

    - name: digest            # schedule present → CronJob
      schedule: "30 6 * * 1-5"
      command: ["mailroom", "send-digests"]

    - name: retention-sweep
      schedule: "15 2 * * *"
      command: ["mailroom", "sweep", "--older-than=90d"]
