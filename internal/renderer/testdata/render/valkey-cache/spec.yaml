# Fixture: the `small` cache preset (#98, ADR-0015). One worker and one valkey
# component, and nothing else — this is the shape of the ValkeyCluster kelson
# writes, pinned into YAML.
#
# The two absences are the assertions that matter. There is no `persistence:`,
# which is what makes a kelson valkey component a cache: with none, the operator
# gives each node an emptyDir and a restart starts empty. And there is no
# `users:`, because this component declares no `auth:` — the unauthenticated
# cache ADR-0015 documents as its largest negative, kept as a fixture because it
# is still what a component that says nothing renders. valkey-auth is the other
# half of that pair.
#
# No bindings here. Binding rendering is valkey-binding's fixture, so a change
# to the ValkeyCluster shape and a change to the env shape fail separately.
apiVersion: kelson.dev/v1alpha1
kind: Project
metadata:
  name: checkout
spec:
  image: ghcr.io/acme/checkout:1.4.2

  components:
    - name: cache
      kind: valkey
      preset: small

    - name: worker
      command: ["bundle", "exec", "sidekiq"]
---
apiVersion: kelson.dev/v1alpha1
kind: Environment
metadata:
  name: staging
spec:
  project: checkout
  namespace: checkout-staging
