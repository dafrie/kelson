# Fixture: the `shared` preset (#89). The database is created inside the
# kelson-owned shared cluster that #93 provisions, so kelson renders a Database
# CR and no Cluster at all.
#
# The namespace is the point. CloudNativePG's Database.spec.cluster is a
# corev1.LocalObjectReference — a name, no namespace — so a Database must sit
# beside the Cluster it targets. This fixture pins that the Database lands in
# kelson-data while the application's own resources stay in shop-development,
# and that provenance travels with it so a human reading the shared namespace
# can tell whose database is whose.
#
# No binding: the shared cluster's credentials live in kelson-data, on the far
# side of a namespace boundary from this workload, and kelson refuses to render
# a secretKeyRef to a Secret nothing creates (#93, #141).
apiVersion: kelson.dev/v1alpha1
kind: Project
metadata:
  name: shop
spec:
  image: ghcr.io/acme/shop:3.0.0

  components:
    - name: db
      kind: postgres
      preset: shared

    - name: api
      port: 3000
---
apiVersion: kelson.dev/v1alpha1
kind: Environment
metadata:
  name: development
spec:
  project: shop
