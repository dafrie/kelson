# Extra manifest emitted alongside the rendered resources, as-is.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: transcoder-ingress
spec:
  podSelector:
    matchLabels:
      kelson.dev/application: transcoder
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              acme.com/partner: cdn
      ports:
        - port: 8443
