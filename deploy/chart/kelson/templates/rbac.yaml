{{- include "kelson.authGate" . -}}
{{- if .Values.rbac.create }}
{{- $stateNs := include "kelson.stateNamespace" . }}
{{- $envNamespaces := concat (list $stateNs) .Values.rbac.targetNamespaces | uniq }}
{{- $buildNs := .Values.server.buildNamespace }}
# Namespaced RBAC. Every rule below exists because a named package makes that
# call; nothing here is a wildcard and nothing is "probably needed".
#
# What is deliberately NOT granted: write access to a project's rendered
# resources (Deployments, Services, and whatever else its manifests contain).
# The server does not apply them — ADR-0028 made delivery a controller loop, and
# kelson-controller carries its own ClusterRole for it. Least-privilege for the
# apply is #84's work along with the rest of the threat model.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kelson.fullname" . }}-state
  namespace: {{ $stateNs }}
  labels:
    {{- include "kelson.labels" . | nindent 4 }}
rules:
  # internal/controlstore's audit trail (issue #78, ADR-0026): one ConfigMap per
  # UTC day, Get and Update to append, List to query, Delete to prune past
  # --audit-retention.
  #
  # No `watch`: no store watches, all read on demand, and a verb nothing calls
  # is a verb that should not be granted. No `patch`: the audit store does
  # read-modify-Update against a resourceVersion, which is what makes concurrent
  # writes conflict instead of silently interleaving.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "update", "delete"]
  # internal/controlstore's spec store (ADR-0027 decision 6). A project is one
  # Project custom resource plus one Environment per environment, in this
  # namespace, written with server-side apply under the field manager
  # `kelson-server`.
  #
  # `patch` is the apply — server-side apply is a PATCH with the apply content
  # type — and it is why there is no `update` here: the store never sends a full
  # replacement. `create` is not granted either, because an apply of an absent
  # object creates it through the same verb. `delete` is DeleteSpec, and it
  # removes the Environments before the Project so a reader never sees an
  # Environment whose Project is gone.
  #
  # No `watch`: the server reads on demand and the controller does the watching,
  # with its own ClusterRole. No `status` subresource: status is the
  # controller's to write, and a server that cannot write it cannot race it
  # (ADR-0027 decision 1).
  - apiGroups: ["kelson.dev"]
    resources: ["projects", "environments"]
    verbs: ["get", "list", "patch", "delete"]
  # internal/controlstore's connection store (ADR-0033 decision 1, issue #248).
  # A GitConnection is one custom resource in this namespace, and the verbs
  # differ from the spec store's a rule above because the write does: there is
  # no UpdateConnection in the schema, so `create` is the only way one is
  # written and `patch` is deliberately NOT granted — a server that could patch
  # a connection could repoint every project resolving through it at a different
  # forge, which is exactly what "delete and create says so" refuses.
  # `delete` is DeleteConnection.
  - apiGroups: ["kelson.dev"]
    resources: ["gitconnections"]
    verbs: ["get", "list", "create", "delete"]
  # The status subresource is the exception to the rule beside `projects`: there
  # the server must not write status because the controller owns it, and here
  # the server IS the writer — TestConnection probes the forge on demand and
  # records what came back, and no GitConnection reconciler exists to race with.
  # When one lands, this grant is what has to be re-argued, not silently kept.
  - apiGroups: ["kelson.dev"]
    resources: ["gitconnections/status"]
    verbs: ["get", "update"]
  # internal/controlstore's agent identity store (issue #74, ADR-0024): one
  # Secret per agent identity, holding a salted HMAC of the credential and never
  # the credential. Get on every request (revocation must be immediate, so no
  # allow decision is cached), List for `kelson agent list`, Create at issuance,
  # Update to revoke. No `delete`: a revoked identity is kept so a past action
  # can still be attributed to a principal that exists.
  #
  # A Secret rather than a ConfigMap even though what is stored is not a
  # credential — identity material belongs behind whatever RBAC an operator puts
  # on Secrets, and this grant is one namespace wide.
  #
  # The same Get is what ADR-0033 decision 1 spends: a GitConnection references
  # a Secret in this namespace, and kelson reads it to mint a token and to call
  # the forge (internal/controlstore's ReadAuthSecret). That is the amendment
  # ADR-0033 makes to ADR-0009 stated as an RBAC grant — the values still live
  # only in Secrets an operator manages, and kelson now uses them rather than
  # only naming them. No `create` is added for it: kelson does not write the
  # Secret behind a token connection, and the app-manifest flow that does write
  # one already has the verb above.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kelson.fullname" . }}-state
  namespace: {{ $stateNs }}
  labels:
    {{- include "kelson.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kelson.fullname" . }}-state
subjects:
  - kind: ServiceAccount
    name: {{ include "kelson.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- range $ns := $envNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kelson.fullname" $ }}-env
  namespace: {{ $ns }}
  labels:
    {{- include "kelson.labels" $ | nindent 4 }}
rules:
  # internal/secret, ADR-0009's cluster backend: server-side apply (patch, plus
  # create for a Secret that does not exist yet), Get for the read-back, List
  # for the label query, Delete for `kelson secret delete`. It is a real
  # privilege and docs/server.md says so — it is bounded by the
  # kelson.dev/managed-secret label the package refuses to write or delete
  # without, and by this Role naming the namespaces it applies to, not by
  # authorization. No RPC returns a secret value.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "patch", "delete"]
  # internal/observation: the deployment read behind a status verdict, the pod
  # list behind it, and the log streams the API serves. internal/delivery/kube's
  # build executor lists the build pod and streams the same subresource.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  # internal/delivery/kube's build executor: Submit creates the Job, Wait polls
  # it by name, and cleanup deletes it with background propagation. It polls
  # rather than watches (jobPollInterval), so `watch` is not granted.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "create", "delete"]
  # internal/delivery/flux: the PR preview read behind PreviewService.ListPreviews
  # (ADR-0017 stage 3). All four kinds live in the environment's own namespace —
  # the lifecycle pair kelson renders, and the per-change-request objects
  # flux-operator instantiates from it — so a namespaced Role covers them. Read
  # only: previews are published by CI and torn down by flux-operator, and no
  # RPC in this schema writes one.
  #
  # NOT granted here, and it cannot be: the HTTPRoutes a preview's hostnames
  # come from live in the preview's *own* namespace, which is created at
  # reconcile time and is therefore not in .Values.rbac.targetNamespaces. Without
  # a cluster-scoped read of httproutes the preview list is complete except for
  # its hostnames, which is why that read degrades to silence rather than to an
  # error. See docs/server.md if you want them.
  - apiGroups: ["fluxcd.controlplane.io"]
    resources: ["resourcesets", "resourcesetinputproviders"]
    verbs: ["get", "list"]
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["ocirepositories"]
    verbs: ["get", "list"]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kelson.fullname" $ }}-env
  namespace: {{ $ns }}
  labels:
    {{- include "kelson.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kelson.fullname" $ }}-env
subjects:
  - kind: ServiceAccount
    name: {{ include "kelson.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- if and $buildNs (not (has $buildNs $envNamespaces)) }}
---
# --build-namespace names a namespace outside the ones served, so it gets the
# build grants and nothing else: no Secret writes, because a build never
# authors one — it only reads the dockerconfigjson --push-secret points at.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kelson.fullname" . }}-build
  namespace: {{ $buildNs }}
  labels:
    {{- include "kelson.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # internal/delivery/kube's registry resolver reads the push Secret to resolve
  # the destination's credentials. Read only, and by name at that.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kelson.fullname" . }}-build
  namespace: {{ $buildNs }}
  labels:
    {{- include "kelson.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kelson.fullname" . }}-build
subjects:
  - kind: ServiceAccount
    name: {{ include "kelson.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
