{{- include "kelson.authGate" . -}}
{{- if .Values.controller.enabled }}
{{- $registryConfigPath := "/etc/kelson/registry/config.json" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kelson.controller.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kelson.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  # One replica is safe unconditionally, and more than one is safe too:
  # controller.leaderElection.enabled defaults on (values.yaml), so a second
  # replica contends for the Lease instead of racing the first one's publish
  # and apply (ADR-0028).
  replicas: {{ .Values.controller.replicaCount }}
  selector:
    matchLabels:
      {{- include "kelson.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        {{- include "kelson.labels" . | nindent 8 }}
        app.kubernetes.io/component: controller
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "kelson.controller.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: kelson-controller
          image: {{ include "kelson.controller.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --health-probe-bind-address=:{{ .Values.controller.probePort }}
            - --metrics-bind-address={{ .Values.controller.metricsBindAddress }}
            {{- if .Values.controller.leaderElection.enabled }}
            - --leader-elect
            - --leader-election-namespace={{ default .Release.Namespace .Values.controller.leaderElection.namespace }}
            {{- end }}
            {{- if .Values.controller.registry }}
            - --registry={{ .Values.controller.registry }}
            {{- end }}
            {{- if .Values.controller.pushSecret }}
            # Points at the file the registry-config volume mount below
            # projects the pushSecret's `.dockerconfigjson` key onto.
            - --registry-config={{ $registryConfigPath }}
            {{- end }}
            {{- if .Values.controller.pullSecret }}
            - --pull-secret={{ .Values.controller.pullSecret }}
            {{- end }}
            {{- if .Values.controller.insecureRegistries }}
            - --insecure-registries={{ join "," .Values.controller.insecureRegistries }}
            {{- end }}
            # Always explicit, and not gated on controller.fluxNamespace being
            # set: the namespaced Role granting the two Flux kinds
            # (templates/controller-flux-role.yaml) is created in this same
            # resolved namespace, and the two must never read different
            # defaults.
            - --flux-namespace={{ include "kelson.controller.fluxNamespace" . }}
            {{- if .Values.controller.reconcileInterval }}
            - --reconcile-interval={{ .Values.controller.reconcileInterval }}
            {{- end }}
            {{- with .Values.controller.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.controller.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: probe
              containerPort: {{ .Values.controller.probePort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: probe
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: probe
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          {{- with .Values.controller.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.controller.pushSecret }}
          volumeMounts:
            - name: registry-config
              mountPath: /etc/kelson/registry
              readOnly: true
          {{- end }}
      {{- if .Values.controller.pushSecret }}
      # The pushSecret is a kubernetes.io/dockerconfigjson Secret, whose data
      # key is literally `.dockerconfigjson` — `items` projects it onto the
      # plain filename $registryConfigPath's directory holds, so the mounted
      # file is the same docker config.json shape internal/artifact's
      # CredentialFromDockerConfig already parses for a CI login (issue #224).
      volumes:
        - name: registry-config
          secret:
            secretName: {{ .Values.controller.pushSecret }}
            items:
              - key: .dockerconfigjson
                path: config.json
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
