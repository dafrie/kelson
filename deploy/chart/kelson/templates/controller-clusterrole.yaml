{{- include "kelson.authGate" . -}}
{{- if and .Values.controller.enabled .Values.controller.rbac.create }}
# The controller's cluster-scoped grant: read the two kelson kinds and write
# their status and finalizer anywhere in the cluster (ADR-0028 steps 1–6). The
# Flux objects the delivery spine writes are a *namespaced* grant instead —
# templates/controller-flux-role.yaml, in .Values.controller.fluxNamespace —
# because kelson owns exactly one OCIRepository/Kustomization pair per
# environment, always in that one namespace, and a namespaced Role is the
# smaller grant for that shape.
#
# Cluster-scoped rather than namespaced because a Project and its Environments
# live wherever their team's namespace is, and a controller that watched only
# the release namespace would silently ignore every other one.
#
# Deliberately, still, no access to workloads (Pods, Deployments) or Secrets.
# R1's exit gate delegates health to Flux's own kustomize-controller instead:
# the Kustomization this controller writes carries `wait: true`
# (internal/controller/fluxobjects.go), so `Ready` already means *healthy* by
# the time this controller reads it back, and it never has to hold RBAC over
# what it did not apply. Wiring internal/observation's finer-grained
# classification (which Pod, which container, which probe) into the reconcile
# loop — and the read-only workload RBAC that would need — is deferred and
# tracked in issue #240, not forgotten.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kelson.controller.fullname" . }}
  labels:
    {{- include "kelson.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
rules:
  # The specs it reconciles. Read-only: the status subresource below is the
  # only thing the controller writes, which is exactly the separation ADR-0027
  # decision 1 gives the status subresource credit for — a controller that
  # cannot write a spec cannot race the user who authored it.
  - apiGroups: ["kelson.dev"]
    resources: ["projects", "environments"]
    verbs: ["get", "list", "watch"]

  # What it observed. `update` beside `patch` because a future reconciler may
  # need to replace a status wholesale; today every write is a merge patch.
  - apiGroups: ["kelson.dev"]
    resources: ["projects/status", "environments/status"]
    verbs: ["get", "patch", "update"]

  # The deletion blocker (internal/controller/environment.go's Finalizer,
  # `kelson.dev/environment`): added on the first successful Ensure, removed
  # only after Teardown has deleted both Flux objects. It is a patch against
  # metadata.finalizers on the main resource, not against a real `/finalizers`
  # subresource a CRD serves — CRDs have no such endpoint — but naming it here
  # is the kubebuilder/controller-runtime convention for exactly this pattern,
  # and some admission paths do check it even where the API server's own
  # subresource routing does not.
  - apiGroups: ["kelson.dev"]
    resources: ["environments/finalizers"]
    verbs: ["update"]
{{- if .Values.controller.leaderElection.enabled }}

  # Leader election, and only when it is on. The Lease is namespaced, so this
  # could be a Role — it is here so that one binding covers a
  # leaderElectionNamespace outside the release namespace, which is the case an
  # operator running the controller apart from the server would hit.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
{{- end }}
{{- end }}
