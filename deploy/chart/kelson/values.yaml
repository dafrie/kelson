# Default values for the kelson chart (issue #58).
#
# Two knobs have no working default and the chart refuses to render without
# them, because guessing either one would be worse than failing:
#
#   image.tag  — the chart never latches `latest`, and guessing a version for
#                you would be worse than asking (see `image` below).
#   auth.*     — in-cluster the server binds 0.0.0.0, and serving that with no
#                authentication must be a deliberate choice (see `auth` below).

# -- Image coordinates for kelson-server.
#
# `tag` has no default and the chart fails without it. `latest` would make a
# Deployment's identity unknowable — two pods of the "same" release could be
# different builds — and defaulting to the chart's appVersion would tie every
# chart change to a release that may not exist for it. Pass the tag you mean:
#
#   --set image.tag=0.0.1
#
# The images goreleaser publishes are ghcr.io/dafrie/kelson-server:<version>
# — the version WITHOUT the tag's `v` prefix, so release v0.0.1 is image tag
# 0.0.1 — plus a `latest` this chart will not use for you (.goreleaser.yml,
# docs/release-policy.md).
image:
  repository: ghcr.io/dafrie/kelson-server
  tag: ""
  pullPolicy: IfNotPresent

# -- Image pull secrets, as a list of {name: …}. The published images are
# public; this is for a mirrored or private copy.
imagePullSecrets: []

# -- Authentication. Required unless you turn it off out loud.
#
# In a cluster the server has to bind 0.0.0.0 — a Service cannot reach a
# process listening on loopback — and `kelson-server --listen 0.0.0.0:8420`
# with no password refuses to start (docs/server.md, ADR-0013 §3). The chart
# mirrors that refusal at render time rather than letting you discover it in a
# CrashLoopBackOff: set one of `existingSecret`, `password`, or `insecure`.
#
# There is still no TLS in kelson-server. A password crossing the network in
# clear is a password anyone on the path has, so put a TLS-terminating proxy in
# front of the Service, or reach it with `kubectl port-forward` (README.md).
auth:
  # -- Preferred: an existing Secret holding the shared password. The chart
  # references it and never sees the value, so the password is not in your
  # values file, your release history or `helm get values` output.
  #
  #   kubectl -n kelson-system create secret generic kelson-auth \
  #     --from-literal=password="$(openssl rand -base64 24)"
  #   helm install … --set auth.existingSecret.name=kelson-auth
  existingSecret:
    name: ""
    key: password

  # -- The lesser option: the password as a literal. The chart creates a Secret
  # from it, which means the value is also in the Helm release record and in
  # whatever file or shell history the `--set` came from. Use existingSecret
  # unless you have a reason not to.
  password: ""

  # -- Serve with no authentication at all, deliberately. This renders
  # `--insecure-bind`, and anything that can reach the Service can deploy to
  # your cluster. Only reasonable when the Service is unreachable by anything
  # you do not trust — and it is never reasonable together with a password, so
  # setting both is an error.
  insecure: false

# -- Server flags. Each field is one flag of kelson-server (docs/server.md);
# `--listen` is not among them because in-cluster it is always 0.0.0.0:port.
server:
  # -- Port the server listens on, and the container port.
  port: 8420

  # -- Namespace holding the spec and history ConfigMaps (`--namespace`).
  # Empty means the release namespace, which is also where the namespaced Role
  # granting those ConfigMaps is created.
  namespace: ""

  # -- Deployment revisions retained per environment (`--keep`).
  keep: 20

  # -- Days of audit records retained (`--audit-retention`), the trail of what
  # each principal actually did (issue #78, ADR-0026). Records live in
  # ConfigMaps in the state namespace, one per UTC day, under the same RBAC the
  # spec and history stores already have — so this needs no extra grant.
  #
  # `0` turns the trail off. That is a choice to make deliberately and out loud:
  # the server says "audit trail: OFF" in its startup banner, because
  # discovering it by finding no records after an incident is the worst possible
  # moment to learn it.
  #
  # Longer retention than the 120-day maximum is an external sink, not a longer
  # ring; a bounded ring that pretended to remember a year would be worse than
  # one that says where its memory ends.
  auditRetention: 30

  # -- Destination registry for builds, e.g. ghcr.io/acme (`--registry`).
  # Empty leaves builds to name their own destination per request.
  registry: ""

  # -- Name of an existing kubernetes.io/dockerconfigjson Secret in the build
  # namespace that authenticates the push (`--push-secret`). The chart does not
  # create it: registry credentials are yours, not the installer's.
  pushSecret: ""

  # -- Namespace build Jobs run in (`--build-namespace`). Empty means the
  # environment's own namespace, as in the CLI.
  buildNamespace: ""

  # -- Registry hosts served over plain HTTP, as a list of `host[:port]`
  # (`--insecure-registries`). The build marks exactly these and nothing else:
  # neither BuildKit nor the CNB lifecycle will talk plain HTTP to a host it was
  # not told about, and neither should — a push that silently downgrades is a
  # credential on the wire in clear.
  #
  # This is what a local cluster needs, where the registry has no certificate:
  #
  #   --set 'server.insecureRegistries={localhost:5000}'
  #
  # It is deliberately an install-time value and not a request field: a caller
  # who could name a registry insecure could make the server push a credential
  # in clear to a host of their choosing.
  insecureRegistries: []

  # -- Delivery credential for Git-backed environments, read from
  # $KELSON_GIT_TOKEN. Reference an existing Secret; there is no literal knob
  # for the same reason `auth.password` is the lesser option.
  gitTokenSecret:
    name: ""
    key: token

  # -- Extra command-line arguments appended verbatim, for a flag this chart
  # does not surface yet.
  extraArgs: []

  # -- Extra environment variables, as ordinary core/v1 EnvVar entries.
  extraEnv: []

# -- Replica count. The server holds no state — specs and history are
# ConfigMaps — so a second replica forks nothing and needs no leader election
# (ADR-0013 §1). More than one is a real HA configuration, not a hope.
replicaCount: 1

# -- kelson-controller: the reconciler behind the Project and Environment
# custom resources (ADR-0027, ADR-0028).
#
# The CRDs themselves are in the chart's `crds/` directory and Helm applies
# them on install whatever this says — registering an API group nobody else
# claims is additive, which is ADR-0027's argument for a CRD being compatible
# with ADR-0003's install doctrine. Note Helm's own limitation while you are
# here: files under `crds/` are applied on `helm install` and **not** upgraded
# by `helm upgrade`, so a chart version that changes a CRD needs
# `kubectl apply -f deploy/crds/` alongside the upgrade.
#
# The Deployment is off by default and that is a statement about maturity, not
# about the design: `kelson-controller` now runs the full ADR-0028 spine —
# render, publish an OCI artifact, SSA-apply the OCIRepository + Kustomization
# pair, read the result back — but a controller that can push to a registry and
# apply Flux objects is a bigger grant than "off" defaults get to skip past
# quietly. Turning it on with no `controller.registry` set still gets you
# `kubectl get environments` with a Ready condition and validation errors in
# `.status` — the controller reports `RegistryNotConfigured` and deploys
# nothing rather than crash-looping (docs/delivery.md).
controller:
  enabled: false

  # -- Image coordinates. `tag` falls back to `image.tag`, because both
  # binaries are cut from one tag by one goreleaser run.
  image:
    repository: ghcr.io/dafrie/kelson-controller
    tag: ""

  # -- Replica count. One is safe unconditionally; see leaderElection below —
  # it defaults on, which is what makes more than one replica safe too.
  replicaCount: 1

  # -- Port the liveness (/healthz) and readiness (/readyz) endpoints bind to.
  probePort: 8081

  # -- Address the Prometheus metrics endpoint binds to (`0` disables it).
  # It is off by default because serving a port nobody scrapes is an open port
  # for no benefit; set `:8080` and point a ServiceMonitor at it.
  metricsBindAddress: "0"

  # -- Registry artifacts are published to, e.g. ghcr.io/acme (`--registry`).
  # Empty means the controller reports `RegistryNotConfigured` on every
  # Environment and publishes nothing (docs/delivery.md) — a registry is a hard
  # requirement of the delivery spine (ADR-0028, "Consequences"), not an
  # optional knob, so leaving this empty is a deliberate "not yet" rather than
  # a working default. Point it at the in-cluster registry
  # (`kelson install registry`, docs/install.md) if you have none of your own:
  #
  #   --set controller.registry=kelson-registry.kelson-system.svc.cluster.local:5000
  registry: ""

  # -- Name of an existing `kubernetes.io/dockerconfigjson` Secret holding the
  # push credential for `registry`. Mounted into the pod and passed as
  # `--registry-config`; the chart does not create it, the same posture
  # `server.pushSecret` takes — a registry credential is yours, not the
  # installer's. Empty is an anonymous push, which is what a registry with no
  # auth (like `kelson install registry`'s) takes.
  pushSecret: ""

  # -- dockerconfigjson Secret in `fluxNamespace` that source-controller
  # authenticates its *pull* with (`--pull-secret`). This is a different
  # credential from `pushSecret`, read by a different process: the controller
  # pushes, source-controller pulls. Named on the OCIRepository it writes, not
  # mounted into this pod — the chart does not create it either.
  pullSecret: ""

  # -- Registry hosts served over plain HTTP, as a list of `host[:port]`
  # (`--insecure-registries`). Exactly these hosts and no others are pushed to
  # (and marked `insecure: true` on the OCIRepository) over plain HTTP — a push
  # that silently downgraded on a failed TLS handshake would put a credential
  # on the wire in clear. What a local registry needs:
  #
  #   --set 'controller.insecureRegistries={kelson-registry.kelson-system.svc.cluster.local:5000}'
  insecureRegistries: []

  # -- Namespace kelson's `OCIRepository` and `Kustomization` pair lives in
  # (`--flux-namespace`). Empty means the release namespace, which is also
  # where the namespaced Role granting those two kinds is created — the flag
  # and the Role's namespace read this one value, so they cannot drift
  # (ADR-0028 decision 3: they are kelson's objects, not the workload's, and
  # live beside the controller that writes them).
  fluxNamespace: ""

  # -- How often Flux re-checks the OCIRepository/Kustomization pair
  # (`--reconcile-interval`). Empty means the binary's own default (5m). This
  # is drift correction, not deploy latency — a new revision reaches Flux
  # through the apply kelson-controller does, not through this poll
  # (docs/delivery.md).
  reconcileInterval: ""

  # -- Leader election. On by default: kelson-controller pushes artifacts and
  # applies Flux objects now (ADR-0028), and two replicas racing to do either
  # is a real hazard rather than a harmless duplicate status write. It is safe
  # to leave on with `replicaCount: 1` too — a single replica always wins its
  # own Lease immediately — so this is what makes scaling to more than one
  # replica a `helm upgrade --set controller.replicaCount=2` away rather than a
  # two-step change.
  leaderElection:
    enabled: true
    # Defaults to the release namespace.
    namespace: ""

  serviceAccount:
    create: true
    # Defaults to <fullname>-controller.
    name: ""
    annotations: {}

  rbac:
    # -- Create the controller's RBAC: the cluster-scoped ClusterRole
    # (kelson.dev Projects and Environments, their status and finalizer
    # subresources, and — when leader election is on — Leases) plus the
    # namespaced Role in `fluxNamespace` granting the two Flux kinds the
    # delivery spine owns. Deliberately absent from both: any read of
    # workloads (Pods, Deployments) — R1 delegates health to Flux's
    # `wait: true` instead (ADR-0028, issue #240). See
    # templates/controller-clusterrole.yaml and
    # templates/controller-flux-role.yaml for the per-rule reasoning.
    create: true

  # -- Resource requests and limits. The controller's work is Kubernetes API
  # calls, a pure render and a registry push, so the shape matches the server's.
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

  # -- Extra command-line arguments appended verbatim, for a flag this chart
  # does not surface yet (`--cluster-profile`, for instance).
  extraArgs: []

  # -- Extra environment variables, as ordinary core/v1 EnvVar entries.
  extraEnv: []

# -- Namespace object. Helm needs the release namespace to exist before it
# writes its own release record, so this is not a substitute for
# `helm install --create-namespace`; it exists for the case where the namespace
# should be part of the release and swept by `helm uninstall`. See README.md.
namespace:
  create: false
  # Defaults to the release namespace.
  name: ""

serviceAccount:
  create: true
  # Defaults to the fullname of the release.
  name: ""
  annotations: {}

rbac:
  # -- Create the namespaced Roles and RoleBindings the server needs.
  create: true

  # -- Create the read-only detect ClusterRole and its binding. It is the
  # cluster-scoped half of the install and it grants get/list only
  # (deploy/rbac/detect-clusterrole.yaml, issue #56). Without it `kelson
  # profile` and server-side dry-run previews report capability gaps instead of
  # facts — they degrade, they do not break.
  createDetectClusterRole: true

  # -- Create the cluster-scoped deploy ClusterRole and its binding: the write
  # access kelson-server needs to apply a rendered spec, plus the reads behind
  # status, logs and managed Secrets, in EVERY namespace of the cluster.
  #
  # **A server expected to deploy needs this.** Without it the web UI's first
  # deploy fails with `cannot patch resource "namespaces"`: the renderer emits
  # the environment's Namespace (#150) and the direct adapter annotates it, and
  # a namespace is cluster-scoped, so no namespaced Role can grant that. The
  # UI also targets a namespace that does not exist yet
  # (`<project>-<environment>`), which is why `rbac.targetNamespaces` cannot be
  # the answer either — you cannot pre-bind a Role in a namespace nothing has
  # created. Same argument for the status verdict and the log stream one click
  # later.
  #
  # **The trade, stated plainly, because it is not small.** This is a broad,
  # cluster-wide write grant. Anything that can authenticate to the server can
  # deploy into any namespace of this cluster — kelson's own namespaces, yours,
  # and `kube-system`. What bounds it is the server's authentication and
  # authorization, not RBAC: today's shared password, the per-identity agent
  # scopes (#74, ADR-0024) and the per-environment agent policy (ADR-0025). The
  # cluster sees one service account with one grant, so RBAC cannot tell one
  # caller from another. Least-privilege for this path — what a per-project or
  # per-environment identity would look like — is #84's threat-model work, and
  # until it lands this value is the whole of the fence.
  #
  # Left `false` so the chart's default posture does not change: the installer
  # does not hand itself broad write unless you say so. A server used only for
  # reading status, previewing diffs, or Git-backed delivery (where Flux does
  # the applying) does not need it.
  #
  # It grants named apiGroups, resources and verbs — no wildcards — and the
  # list tracks what the renderer emits. An overlay (`spec.overlays`) can emit
  # any kind at all and the chart does not guess those: bind a ClusterRole of
  # your own alongside this one. See templates/clusterrole-deploy.yaml for the
  # per-rule reasoning and docs/server.md for the posture.
  createDeployClusterRole: false

  # -- Namespaces the server may serve besides the release namespace. Each one
  # gets the same environment Role: managed Secrets, build Jobs, and the reads
  # behind status and logs. Nothing here grants access to a namespace you did
  # not list, which is how docs/server.md says to bound today's single shared
  # password.
  targetNamespaces: []

service:
  type: ClusterIP
  port: 8420
  annotations: {}

# -- Resource requests and limits. The defaults are a starting point for a Go
# process whose work is Kubernetes API calls, not computation.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

# -- Liveness and readiness probes. Both hit /healthz, which never requires
# authentication — a probe holds no credential (docs/server.md).
livenessProbe:
  initialDelaySeconds: 5
  periodSeconds: 20
  timeoutSeconds: 3
  failureThreshold: 3
readinessProbe:
  initialDelaySeconds: 2
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

# -- Extra labels added to every object the chart creates, on top of the
# standard Helm labels and kelson.dev/install.
commonLabels: {}
