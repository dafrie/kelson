# Material for MkDocs configuration.
# See https://squidfunk.github.io/mkdocs-material/

site_name: kelson
site_description: A self-hosted PaaS that runs on your Kubernetes cluster and writes standard manifests instead of hiding them.
site_url: https://dafrie.github.io/kelson/
repo_url: https://github.com/dafrie/kelson
repo_name: dafrie/kelson
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - toc.integrate
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Vision: vision.md
  - Architecture: architecture.md
  - Roadmap: roadmap.md
  - Competitive analysis: competitive-analysis.md
  - ADRs:
      - Index: adr/README.md
      - 0001 — Hybrid state model: adr/0001-hybrid-state-model.md
      - 0002 — Tech stack: adr/0002-tech-stack.md
      - 0003 — Install model: adr/0003-install-model.md
      - 0004 — Licensing: adr/0004-licensing.md
      - 0005 — Delegate to operators: adr/0005-delegate-to-operators.md
      - 0006 — Project, Application, Environment: adr/0006-project-application-environment.md
      - 0007 — Data services: adr/0007-data-services.md
      - 0008 — MCP surface: adr/0008-mcp-surface.md
      - 0009 — Secrets: adr/0009-secrets.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

plugins:
  - search
