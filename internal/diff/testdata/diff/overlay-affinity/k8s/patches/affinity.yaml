apiVersion: apps/v1
kind: Deployment
metadata:
  name: transcoder
spec:
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: acme.com/gpu
                    operator: In
                    values: ["true"]
