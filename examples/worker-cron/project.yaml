apiVersion: kelson.dev/v1alpha1
kind: Project
metadata:
  name: mailroom

# A queue system: one long-running worker and two cron components.
# Workload kinds are derived — no `kind:` needed anywhere here (docs/model.md).
spec:
  image: registry.acme.run/mailroom:2.0.7

  # A `kind: valkey` queue component and the QUEUE_URL/QUEUE_PASSWORD bindings
  # onto it belong here. Postgres components render since #89; valkey does not,
  # and kelson refuses it loudly rather than rendering nothing (#98).

  components:
    - name: worker            # no port, no schedule → worker (Deployment)
      command: ["mailroom", "work"]
      replicas: { min: 2 }

    - name: digest            # schedule present → CronJob
      schedule: "30 6 * * 1-5"
      command: ["mailroom", "send-digests"]

    - name: retention-sweep
      schedule: "15 2 * * *"
      command: ["mailroom", "sweep", "--older-than=90d"]
