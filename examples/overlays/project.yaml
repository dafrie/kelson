apiVersion: kelson.dev/v1alpha1
kind: Project
metadata:
  name: streaming

# Needs the escape hatch: node affinity for GPU nodes, and a NetworkPolicy the
# schema does not (and will not) model. Always available, never required.
spec:
  source:
    git: https://github.com/acme/streaming
  build:
    strategy: dockerfile

  components:
    # Rendered as a ValkeyCluster by the operator kelson delegates to
    # (ADR-0015). Its whole configuration is its preset: the topology, the
    # memory limit and the eviction policy come with it (#98).
    - name: cache
      kind: valkey
      preset: ha-small

    - name: transcoder
      port: 8443
      domains: [stream.acme.com]
      resources:
        requests: { cpu: 4, memory: 8Gi }
      env:
        REDIS_URL: { from: { service: cache, key: uri } }

  # Escape hatch. Always available, never required (rule P6: project first).
  overlays:
    - patch: ./k8s/patches/affinity.yaml       # merged into rendered workloads
    - manifest: ./k8s/extra/networkpolicy.yaml # emitted as-is
