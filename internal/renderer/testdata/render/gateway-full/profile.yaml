# A cluster that has everything: Gateway API AND an ingress class,
# cert-manager, Prometheus. The ingress class is kept deliberately: detection
# still records it for the migration nudge (#112), and this fixture pins that
# the renderer never renders against it (#140).
gatewayAPI:
  version: v1.6.0
  classes: [envoy]
ingressClasses:
  - { name: nginx, controller: k8s.io/ingress-nginx, default: true }
certManager:
  clusterIssuers: [letsencrypt-prod]
prometheus:
  serviceMonitor: true
  podMonitor: true
metricsServer: {}
cnpg: {}
