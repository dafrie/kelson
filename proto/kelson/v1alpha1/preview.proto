// PreviewService: which pull requests of an environment are running
// (ADR-0017 stage 3).
//
// ADR-0017 decision 7 said plainly that kelson's Status and History RPCs do not
// enumerate preview children, and that an API which does "is a new decision
// about what a preview *is* to kelson's model". This service is that decision,
// and it is the smaller of the two it could have been: a preview stays a thing
// the cluster describes, not a second class of Environment. Nothing here writes.
//
// # Read-only, and why there is no Publish
//
// Previews are created by a CI job running `kelson preview publish`
// (ADR-0017 decision 8) and destroyed by flux-operator when the change request
// closes. Neither end of that lifecycle is the server's, so a write RPC here
// would either duplicate the publisher — without the checkout and the image
// reference CI already has — or delete an object flux-operator would recreate on
// its next poll. `Publish` is deferred by ADR-0017, not forgotten.
//
// # The answer is assembled from two sources and says which is which
//
// `settings` is what the spec declares, resolved: it exists whenever the
// Environment carries a `previews:` block, with or without a cluster.
// `lifecycle` and `previews` are what the cluster holds, and are read as soon
// as `settings` exists. There used to be a third answer — settings with no
// cluster read and the renderer's own `render/previews-require-flux` in
// `errors`, for an environment whose delivery mode could not run previews —
// and it is gone with the mode vocabulary (ADR-0028 decision 8). Nothing about
// a spec can make previews unavailable any more.
syntax = "proto3";

package kelson.v1alpha1;

import "kelson/v1alpha1/common.proto";
import "kelson/v1alpha1/render.proto";

option go_package = "github.com/dafrie/kelson/internal/api/gen/kelson/v1alpha1;kelsonv1alpha1";

message ListPreviewsRequest {
  SpecRef spec = 1;
  // Optional when the spec holds exactly one environment, as everywhere else.
  string environment = 2;
}

message ListPreviewsResponse {
  string project = 1;
  string environment = 2;
  // The parent environment's resolved namespace: where the lifecycle pair and
  // every per-change-request object live (ADR-0017 decision 3).
  string namespace = 3;
  // Vestigial: the spec has had exactly one delivery path, Flux, since
  // ADR-0028 decision 9, so this is always the constant "flux". The field
  // stays on the wire because removing or renaming it would break every
  // v1alpha1 client in both languages — the same trade ADR-0032 decision D
  // made for LogSelector.application — and it goes at the next breaking
  // schema change.
  string mode = 4;

  // Unset when the Environment declares no `previews:` block at all. That is
  // the ordinary case and not an error: it is what the empty state explains.
  PreviewSettings settings = 5;
  // Unset when the cluster was not read, which now happens only when the
  // Environment declares no previews. The delivery-mode gate that used to
  // also leave this unset is gone (ADR-0028 decision 8).
  PreviewLifecycle lifecycle = 6;
  // Sorted by change request number, highest first.
  repeated Preview previews = 7;
  // Structured findings about the spec, as opposed to a transport error
  // (internal/api's contract). The mode-based refusal that used to arrive
  // here — `render/previews-require-flux` — is gone with the delivery-mode
  // gate (ADR-0028 decision 8): nothing about a spec can make previews
  // unavailable any more, so nothing populates this field today.
  repeated Error errors = 8;
}

// PreviewSettings is `Environment.spec.previews` with kelson's defaults filled
// in — the same resolution the renderer performs, so the limit and the interval
// a reader sees here are the ones the cluster will enforce.
//
// It carries no credential and cannot: `secret_ref` fields are Secret *names*
// (ADR-0009, ADR-0017), which is what the spec holds and all it holds.
message PreviewSettings {
  string provider = 1;   // github | gitlab
  string repo = 2;       // the source repository whose change requests become previews
  string secret_ref = 3; // name of the Secret holding forge credentials
  string interval = 4;   // how often the forge is polled
  // The change request filter, as authored.
  repeated string filter_labels = 5;
  string include_branch = 6;
  string exclude_branch = 7;
  // The simultaneous-preview ceiling, always populated: it is a cost control,
  // and one nobody can read off the manifest is one nobody checks (ADR-0017).
  int32 limit = 8;
  // Labels that pause preview *updates*; a `!` prefix pauses while absent.
  repeated string skip_labels = 9;
  // The oci:// repository per-change-request manifests are published to and
  // pulled from, and the optional pull Secret's name.
  string artifacts_repository = 10;
  string artifacts_secret_ref = 11;
}

// PreviewLifecycle is the ResourceSetInputProvider / ResourceSet pair that owns
// the per-change-request lifecycle. It answers what a list of previews cannot:
// an empty list because nothing is labelled looks exactly like an empty list
// because the poller cannot reach the forge.
message PreviewLifecycle {
  // `<project>-<environment>-previews`, the name both objects share.
  string name = 1;
  // False when the cluster does not serve `fluxcd.controlplane.io` at all —
  // flux-operator is not installed, and nothing else here means anything.
  bool served = 2;
  // False when the pair has not been delivered to the cluster yet.
  bool present = 3;
  // Kubernetes condition statuses ("True" / "False" / "Unknown") with the
  // reason and message that came with them.
  string provider_ready = 4;
  string provider_reason = 5;
  string provider_message = 6;
  string set_ready = 7;
  string set_reason = 8;
  string set_message = 9;
}

// Preview is one change request's preview as the cluster reports it.
message Preview {
  // The change request number, as the forge numbers it.
  string id = 1;
  // `<project>-<environment>-pr<id>`: the preview's namespace, and also the
  // name of the OCIRepository and Kustomization it is read from.
  string namespace = 2;
  // The head commit the OCIRepository pins — what is *actually* running, read
  // from the object rather than derived from the change request (ADR-0017
  // decision 2).
  string sha = 3;
  // ready | applying | awaiting-artifact | failed | unknown. Decided
  // server-side so the CLI, the UI and an agent read the same word.
  string phase = 4;
  string reason = 5;
  string message = 6;
  // The two Ready conditions behind `phase`, kept separate so a client can tell
  // "nothing was published" from "what was published did not apply".
  string artifact_ready = 7;
  string applied_ready = 8;
  // The artifact revision the Kustomization last applied.
  string revision = 9;
  // A suspended preview is frozen, not broken.
  bool suspended = 10;
  // The hostnames this preview's HTTPRoutes claim, sorted. Every one carries
  // the change request in its first DNS label, because a preview never serves
  // the hostname the spec asks for (ADR-0017 decision 11).
  repeated string hosts = 11;
  // RFC 3339 creation time of the preview's Kustomization — when the preview
  // appeared — and its age at the moment the server answered, so a client
  // renders the same age the CLI would without a synchronised clock.
  string created_at = 12;
  int64 age_seconds = 13;
}

service PreviewService {
  rpc ListPreviews(ListPreviewsRequest) returns (ListPreviewsResponse);
}
