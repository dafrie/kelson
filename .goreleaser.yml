# goreleaser config — issue #21.
#
# Cutting a release is one tag (see docs/release-policy.md):
#   git tag v0.X.Y && git push origin v0.X.Y
# The GitHub Actions release workflow runs `goreleaser release --clean`.
#
# Local dry-run: `make release-snapshot` (or `goreleaser release --snapshot --clean`).

version: 2

project_name: kelson

before:
  hooks:
    - go mod tidy

builds:
  - id: kelson
    main: ./cmd/kelson
    binary: kelson
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/dafrie/kelson/internal/version.Version={{.Version}}
      - -X github.com/dafrie/kelson/internal/version.Commit={{.ShortCommit}}

  - id: kelson-server
    main: ./cmd/kelson-server
    binary: kelson-server
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/dafrie/kelson/internal/version.Version={{.Version}}
      - -X github.com/dafrie/kelson/internal/version.Commit={{.ShortCommit}}

  # kelson-mcp is a stdio sidecar: an MCP client launches it as a child process
  # and talks to it over stdin/stdout (docs/mcp.md, ADR-0008). It has no
  # listener, so there is deliberately no docker image for it below — a
  # container with nothing on stdin would have nothing to do.
  - id: kelson-mcp
    main: ./cmd/kelson-mcp
    binary: kelson-mcp
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/dafrie/kelson/internal/version.Version={{.Version}}
      - -X github.com/dafrie/kelson/internal/version.Commit={{.ShortCommit}}

  # kelson-controller reconciles the kelson.dev custom resources (ADR-0027).
  # It ships as a binary as well as an image because `kelson-controller
  # --kubeconfig` against a remote cluster is a real way to run it while
  # developing, and because every other binary in this release is downloadable.
  - id: kelson-controller
    main: ./cmd/kelson-controller
    binary: kelson-controller
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/dafrie/kelson/internal/version.Version={{.Version}}
      - -X github.com/dafrie/kelson/internal/version.Commit={{.ShortCommit}}

archives:
  - id: kelson
    ids: [kelson, kelson-server, kelson-mcp, kelson-controller]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md
      - docs/release-policy.md

dockers:
  - id: kelson-server-amd64
    ids: [kelson-server]
    goos: linux
    goarch: amd64
    use: buildx
    dockerfile: Dockerfile
    image_templates:
      - "ghcr.io/dafrie/kelson-server:{{ .Version }}-amd64"
    build_flag_templates:
      - "--platform=linux/amd64"

  - id: kelson-server-arm64
    ids: [kelson-server]
    goos: linux
    goarch: arm64
    use: buildx
    dockerfile: Dockerfile
    image_templates:
      - "ghcr.io/dafrie/kelson-server:{{ .Version }}-arm64"
    build_flag_templates:
      - "--platform=linux/arm64"

  - id: kelson-controller-amd64
    ids: [kelson-controller]
    goos: linux
    goarch: amd64
    use: buildx
    dockerfile: Dockerfile.controller
    image_templates:
      - "ghcr.io/dafrie/kelson-controller:{{ .Version }}-amd64"
    build_flag_templates:
      - "--platform=linux/amd64"

  - id: kelson-controller-arm64
    ids: [kelson-controller]
    goos: linux
    goarch: arm64
    use: buildx
    dockerfile: Dockerfile.controller
    image_templates:
      - "ghcr.io/dafrie/kelson-controller:{{ .Version }}-arm64"
    build_flag_templates:
      - "--platform=linux/arm64"

docker_manifests:
  - name_template: "ghcr.io/dafrie/kelson-server:{{ .Version }}"
    image_templates:
      - "ghcr.io/dafrie/kelson-server:{{ .Version }}-amd64"
      - "ghcr.io/dafrie/kelson-server:{{ .Version }}-arm64"
  - name_template: "ghcr.io/dafrie/kelson-server:latest"
    image_templates:
      - "ghcr.io/dafrie/kelson-server:{{ .Version }}-amd64"
      - "ghcr.io/dafrie/kelson-server:{{ .Version }}-arm64"

  - name_template: "ghcr.io/dafrie/kelson-controller:{{ .Version }}"
    image_templates:
      - "ghcr.io/dafrie/kelson-controller:{{ .Version }}-amd64"
      - "ghcr.io/dafrie/kelson-controller:{{ .Version }}-arm64"
  - name_template: "ghcr.io/dafrie/kelson-controller:latest"
    image_templates:
      - "ghcr.io/dafrie/kelson-controller:{{ .Version }}-amd64"
      - "ghcr.io/dafrie/kelson-controller:{{ .Version }}-arm64"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^Merge pull request"
      - "^Merge branch"

release:
  # Published immediately, not draft: releases here are cut deliberately (one
  # tag or one dispatch), and a draft only adds a manual click that hides the
  # release from the public page until someone remembers it.
  draft: false
  prerelease: auto
  github:
    owner: dafrie
    name: kelson
