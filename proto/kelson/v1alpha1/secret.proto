// SecretService: the authoring half of ADR-0009's `cluster` secret backend
// (issue #116), served.
//
// A kelson spec carries secret references, never values. `{secret: <name>,
// key: <key>}` renders as a valueFrom.secretKeyRef against a Secret in the
// environment's namespace (ADR-0018); this service is what writes that Secret.
//
// # Values travel in, never out
//
// SetSecret carries values over the wire. Nothing carries one back:
// ListSecrets and SetSecret's own response return names, keys, namespaces and
// ages, and no message in this file has a field a value could arrive in. That
// is ADR-0009's masked read-back stated as a schema property rather than as a
// handler's promise — a client that wanted the value could not decode one, and
// a future handler that tried to send one would have nowhere to put it.
//
// The server registers every value it receives with internal/redact before it
// does anything else with it, so a value cannot reach a log, an error message
// or an error detail whichever plane writes it (issue #117).
//
// # Deliberately omitted, and why
//
// **No GetSecret.** Issue #116 leaves the door open to a full-value read that
// is "explicitly requested and audited"; there is no audit log to record it in
// (ADR-0013 §1: the server holds no state), so a read that claimed to be
// audited would be a claim rather than a fact. Reading a value back is
// `kubectl get secret` and the cluster's own RBAC and audit trail.
//
// **No idempotency_key**, which every other mutating RPC in this schema carries
// (issue #69). A key exists so a retry after a timeout is the same operation
// rather than a second one, and both mutations here are already convergent: a
// SetSecret is a server-side apply, so replaying it produces the identical
// object, and a DeleteSecret replayed after it succeeded finds nothing and says
// so. There is also nowhere to record a key — the spec store's idempotency
// lives in the ConfigMap it writes, and this service writes a Secret whose
// contents are not kelson's to annotate. A field that changed no outcome would
// be worse than its absence.
//
// **No unset.** Removing one key of a Secret is the other half of #116 and is
// not attempted here: `SetSecret` merges rather than replaces (see its
// comment), so there is no shape in this file that could express "and drop the
// keys I did not name" by accident.
syntax = "proto3";

package kelson.v1alpha1;

import "kelson/v1alpha1/common.proto";

option go_package = "github.com/dafrie/kelson/internal/api/gen/kelson/v1alpha1;kelsonv1alpha1";

// SecretTarget addresses the namespace a Secret lives in.
//
// It is a (project, environment) pair rather than a namespace because a
// secret's lifecycle is the environment's (issue #116) and because the
// provenance labels record both. The namespace is derived the way the renderer
// derives it — `<project>-<environment>` — and `namespace` overrides that only
// for an Environment whose spec sets `spec.namespace`.
message SecretTarget {
  string project = 1;
  string environment = 2;
  // Optional override of the derived `<project>-<environment>`.
  string namespace = 3;
}

message SetSecretRequest {
  SecretTarget target = 1;
  // Name of the Secret — the same string a `{secret: <name>, key: <key>}`
  // reference carries. A DNS-1123 label, held to exactly what the reference is
  // held to, so a Secret kelson writes is always one a spec can name.
  string name = 2;
  // The keys to write. Keys of the same Secret that are NOT named here are
  // preserved: this is a merge, not a replacement, so rotating one credential
  // does not prune the others. Values are never echoed back in any response.
  map<string, string> values = 3;
  // RENDER validates the request and touches nothing. SERVER is a real
  // Kubernetes server-side dry-run apply: admission runs and the merge is
  // computed against the live object, and nothing is persisted.
  DryRun dry_run = 4;
}

message SetSecretResponse {
  // The masked read-back: what the Secret holds now, keys only.
  SecretSummary secret = 1;
  // The keys this call wrote, sorted. Everything in `secret.keys` and not here
  // was already there and was preserved.
  repeated string written_keys = 2;
  // True when nothing was persisted because the request was a dry run.
  bool dry_run = 3;
}

message ListSecretsRequest {
  SecretTarget target = 1;
}

message ListSecretsResponse {
  // Only the Secrets kelson manages, sorted by name. A namespace's TLS
  // material, service-account tokens and image-pull credentials are not
  // kelson's to enumerate, so they are absent rather than filtered: the server
  // asks the API server a label query and never reads the rest.
  repeated SecretSummary secrets = 1;
  // The resolved namespace, so a client does not have to re-derive it.
  string namespace = 2;
}

message DeleteSecretRequest {
  SecretTarget target = 1;
  string name = 2;
  // SERVER asks the API server to validate the delete and discard it. RENDER
  // validates the request alone.
  DryRun dry_run = 3;
}

message DeleteSecretResponse {
  // False when the request was a dry run, which removes nothing.
  bool deleted = 1;
  string namespace = 2;
}

// SecretSummary is a Secret as this service reports it: what exists, not what
// is in it. There is no value field and there is not going to be one.
message SecretSummary {
  string name = 1;
  string namespace = 2;
  // The Secret's data keys, sorted. A key name is a reference — it is what a
  // spec's `key:` names — so keys are reported everywhere values are not.
  repeated string keys = 3;
  // RFC 3339 creation timestamp, empty when the API server reported none.
  string created_at = 4;
  // Age in seconds at the moment the server answered, so a client renders the
  // same age the CLI does without needing a synchronised clock.
  int64 age_seconds = 5;
}

// SecretService is gated by the server's authentication like every other
// service here (issue #84's interim cut): the middleware matches on the
// `/kelson.v1alpha1.` route prefix, so a service added to this schema is
// covered by construction rather than by remembering to add it.
service SecretService {
  rpc SetSecret(SetSecretRequest) returns (SetSecretResponse);
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse);
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse);
}
