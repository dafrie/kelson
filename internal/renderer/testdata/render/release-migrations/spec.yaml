# Fixture: the release-command hook (#104, ADR-0019).
#
# `release:` on a workload component renders one extra pair of resources — the
# component's ServiceAccount, moved here from its workload group, and a Job
# running the component's image with the component's environment. The pair sits
# after the data service the migration talks to and before every workload,
# because order is the only sequencing a rendered set can express (#89); the
# WAITING is the direct adapter's, which is why the field renders in direct
# mode only.
#
# What to look for in the golden:
#   - the Job's name carries the component and the leading 8 hex of its
#     spec-hash, so re-applying an unchanged revision addresses the Job that
#     already ran;
#   - the Job's env is the component's env, bindings included: the migration
#     reads exactly the DATABASE_URL the application reads;
#   - restartPolicy Never, backoffLimit 2, and the activeDeadlineSeconds the
#     spec's timeout resolves to;
#   - `worker`, which declares no release hook, keeps its own ServiceAccount in
#     its own group.
apiVersion: kelson.dev/v1alpha1
kind: Project
metadata:
  name: checkout
spec:
  image: ghcr.io/acme/checkout:1.4.2

  env:
    DATABASE_URL: { from: { service: db, key: uri } }

  components:
    - name: db
      kind: postgres
      preset: small

    - name: web
      port: 8080
      release:
        command: ["./manage.py", "migrate", "--noinput"]
        timeout: 15m
      env:
        SECRET_KEY: { secret: web-secrets, key: django-secret-key }

    - name: worker
      command: ["bundle", "exec", "sidekiq"]
---
apiVersion: kelson.dev/v1alpha1
kind: Environment
metadata:
  name: staging
spec:
  project: checkout
  namespace: checkout-staging
  delivery:
    mode: direct
