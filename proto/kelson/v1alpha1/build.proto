// BuildService: the build plane over the API (issues #48, #49, #54, ADR-0010).
//
// `kelson build` already turns a Project's source into a digest-pinned image
// with an in-cluster Job — BuildKit for a Dockerfile, the Cloud Native
// Buildpacks lifecycle without one (docs/build.md). This service is that same
// pipeline reached over the schema, so a UI or an agent can build without a
// kubeconfig and without the CLI — which is what the browser create-from-git
// path (#63) needs, since a browser has neither.
//
// # What the server decides and what it does not
//
// The split is the CLI's, unchanged (ADR-0010): *how* to build comes from the
// spec, *where* the image goes is infrastructure configuration. The request may
// override the destination because a caller may legitimately push somewhere
// else; it may not override the strategy, because that would put build
// configuration in the caller's hands rather than in the spec's, which is
// exactly what ADR-0010 forbids. There is deliberately no strategy field here.
syntax = "proto3";

package kelson.v1alpha1;

import "kelson/v1alpha1/render.proto";

option go_package = "github.com/dafrie/kelson/internal/api/gen/kelson/v1alpha1;kelsonv1alpha1";

message BuildRequest {
  SpecRef spec = 1;
  string environment = 2; // optional when the spec holds exactly one

  // Destination prefix, e.g. ghcr.io/acme. Empty means the server's own
  // default (kelson-server --registry / KELSON_REGISTRY). The repository is
  // <registry>/<project>: one repository per Project, because the source is
  // project-level and so is the build (docs/build.md).
  string registry = 3;
  // Name of an existing kubernetes.io/dockerconfigjson Secret in the build
  // namespace that authenticates the push. Empty means the server's default
  // (--push-secret); a server with neither pushes unauthenticated, which is
  // correct for a cluster-internal registry and fails at push time otherwise.
  // It is a reference, never a value (ADR-0009).
  string push_secret = 4;
  // Git branch, tag or commit to build. Empty means the Project's
  // spec.source.ref, and empty again means the repository's default branch.
  // Whatever it names is resolved to a commit once, before the build starts,
  // so the tag, the recorded revision and the tree the build pod checks out
  // are the same string.
  string ref = 5;

  // There is no strategy override: ADR-0010 makes the strategy the spec's
  // (an explicit spec.build.strategy wins, else a Dockerfile decides and its
  // absence selects buildpacks), and a per-request override would move build
  // configuration into the caller.
  //
  // There is no idempotency_key either, and that is not an oversight. The
  // other mutating RPCs carry one because they write state a replay would
  // duplicate; a build writes an image whose name is derived from the resolved
  // commit, so a rebuild of the same commit pushes the same content to the
  // same tag and resolves to the same digest. Re-running is already a replay.
  // The executor reinforces it: a build Job's name is a function of its
  // Request, so a concurrent identical build adopts the running Job rather
  // than starting a second one.
}

// BuildResponse streams the build as it happens: the plan, then the raw build
// output, then the pinned result.
//
// Failures are ConnectRPC errors carrying kelson.v1alpha1.Error details, not
// events — a build that fails produced no image, so there is no result message
// that could honestly describe it. The build plane's codes (build/no-source,
// build/nothing-to-build, build/detection-needs-source, and
// build/strategy-not-implemented, which no strategy returns today) pass through
// verbatim, like every other plane's (ADR-0013 §2).
message BuildResponse {
  oneof event {
    Started started = 1;  // first event, exactly one: what is about to be built
    Log log = 2;          // build output, as it is produced
    Finished finished = 3; // terminal event, exactly one, last
  }

  // Started is sent after the strategy is resolved and the ref is resolved to
  // a commit, so everything it carries is settled fact rather than intent.
  message Started {
    string strategy = 1;         // "dockerfile" or "buildpacks": the resolved ADR-0010 strategy
    string image_repository = 2; // <registry>/<project>, no tag, no digest
    string tag = 3;              // the human-readable tag pushed alongside the digest
    string revision = 4;         // the 40-hex commit the build clones
  }

  // Log is raw build output — the bytes the builder and the clone container wrote,
  // not lines. The stream chunks them for transport and preserves nothing else:
  // a chunk boundary is not a line boundary, so a client that wants lines
  // splits the concatenation itself.
  message Log {
    bytes chunk = 1;
  }

  message Finished {
    // Fully-qualified and always digest-pinned, e.g. ghcr.io/acme/shop@sha256:…
    // A mutable reference is refused rather than returned: deploying by digest
    // is the guarantee the build exists to provide (#51).
    string reference = 1;
    string digest = 2; // sha256:…
  }
}

// ReportBuildRequest is the CI hand-off of ADR-0034 decision 3: "I built the
// image, you take it from here".
//
// It is the whole of what CI owes kelson on the `by: ci` path. CI builds and
// reports; kelson renders and publishes, server-side, through the same
// resolve → render → publish → ensure spine every other trigger converges on
// (ADR-0034 decision 1, ADR-0028). CI never runs kelson's renderer, never needs
// a checkout of the spec, and never holds the artifact-registry credential —
// which is the shrink ADR-0034 performs on ADR-0017 decision 8's
// `kelson preview publish`, now the escape hatch for pipelines that cannot
// reach kelson at all.
//
// The message therefore carries exactly what CI knows and nothing it does not:
// a commit, where that commit came from, and which images exist for it. It does
// not carry the render, the environment, or a decision about what to deploy —
// those are the server's, computed from the stored spec at report time, because
// a report that named its own targets would be CI deciding delivery.
//
// # A reported image is trusted on the reporter's word
//
// kelson publishes manifests referencing these digests without verifying
// provenance. That is the same trust boundary ADR-0017 recorded for artifacts —
// the registry's write access — now with a second writer, and ADR-0034 names it
// as a consequence rather than hiding it. Signing and verification is one
// decision for images and artifacts together, and it is still unowned.
message ReportBuildRequest {
  // The stored spec's project name. There is no inline-documents form: a report
  // triggers a server-side render of what the server holds, so a spec supplied
  // in the request would render something no environment is deployed from.
  string project = 1;
  // The 40-hex commit the images were built from. It is the join key of the
  // whole hand-off: the preview publishes at this SHA (ADR-0017's tag), and a
  // tracking environment redeploys only if this is the head of the ref it
  // follows. A ref name without it would leave "which commit is running?"
  // answerable only by racing the forge.
  string sha = 2;
  // The branch or tag the commit was built from, e.g. "refs/heads/main" or
  // "main". It is what selects tracking environments (ADR-0034 decision 4):
  // `autoDeploy` environments following this ref re-render, and everything else
  // ignores the report. Empty reports the images and triggers no environment.
  string ref = 3;
  // The change request number when this build is for one, and 0 when it is not
  // — the CLI's `--pr`. Non-zero routes the report to that change request's
  // preview; zero routes it to tracking environments. A separate field rather
  // than an overload of `ref`, because a pull request's head ref and the branch
  // an environment follows are different questions that happen to look alike.
  int32 pr = 4;
  // Component name to image reference, digest-pinned, e.g.
  // {"web": "ghcr.io/acme/checkout-web@sha256:…"}. Digest-pinned is a
  // requirement and not a convention: a mutable tag would make the published
  // artifact describe something that can change underneath it, which is the
  // guarantee the build plane exists to provide (#51, ADR-0010).
  //
  // A key the Project does not declare is an error naming it, not a silent
  // drop; a component the Project declares and this map omits keeps whatever
  // the spec resolves for it, so a partial report is a partial pin rather than
  // a broken render.
  map<string, string> images = 5;
  // A report is not convergent the way a build is — it triggers a publish and
  // records a mapping — so a retry after a timeout must be the same report
  // rather than a second one (#69). This is the field BuildRequest deliberately
  // does not have, for the reason stated there: a build's output is a function
  // of its resolved commit, and a report's effect is not.
  string idempotency_key = 6;
}

message ReportBuildResponse {
  // True when the report was recorded. False with a message is a report kelson
  // understood and declined to act on — a project whose `build.by` is `kelson`,
  // so its images come from kelson's own build plane and a CI report would be
  // publishing over it.
  bool accepted = 1;
  // What the report triggered, as environment and preview identifiers —
  // environment names for tracking environments, `pr<number>` for a change
  // request's preview. Empty is an ordinary answer and not a failure: a report
  // for a ref no environment follows is recorded and triggers nothing, which is
  // exactly what a report for a feature branch should do.
  repeated string triggered = 2;
  // Why `triggered` is what it is, in prose: which environments matched, or
  // that none did and what would have. A pipeline whose report silently did
  // nothing is the failure mode this field exists to prevent — ADR-0034 names
  // "why didn't my preview update" as the debugging question the whole trigger
  // pipeline has to stay answerable for.
  string message = 3;
}

// BuildService builds a Project's source into an image, in the cluster.
service BuildService {
  // Build streams one build to completion.
  //
  // # Cancellation leaves the Job running
  //
  // Cancelling the RPC stops the server watching, and that is all it stops.
  // The executor's Wait returns as soon as the context is done, before it
  // reaches the branch that deletes the Job (internal/delivery/kube's
  // BuildExecutor), so the build Job keeps running in the cluster, finishes or
  // hits its activeDeadlineSeconds, and is left behind for an operator to see.
  // That is deliberate — a half-finished push is worse than a completed one
  // nobody waited for — but it does mean an abandoned build is not a cancelled
  // build, and `kubectl -n <build namespace> get jobs` is where it went.
  //
  // # `auto` needs a source tree the server does not have
  //
  // Strategy detection reads the source tree, and a server has no local
  // checkout — the tree exists only inside the build pod, after the clone. The
  // CLI answers this with -C pointing at a checkout; there is no server-side
  // equivalent, so a spec whose strategy resolves to `auto` fails here with
  // build/detection-needs-source and says to set spec.build.strategy instead.
  // In-cluster detection before choosing a driver is issue #50.
  rpc Build(BuildRequest) returns (stream BuildResponse);

  // ReportBuild is the other end of the same plane: not "build this for me" but
  // "I built it, here is where it is" (ADR-0034 decision 3). It is `kelson ci
  // report-build`, and it is what a project with `build.by: ci` uses instead of
  // Build.
  //
  // # CI is a principal
  //
  // This RPC authenticates as an agent identity (ADR-0024) — a scoped, expiring
  // credential minted for the pipeline, auditable per ADR-0026 — and not as the
  // instance's shared password. CI was always an agent in every sense that
  // matters; ADR-0034 decision 6 makes it one in the sense kelson enforces, and
  // invents no new auth mechanism to do it. A credential scoped to one project
  // therefore cannot report a build for another, checked server-side before the
  // handler runs, like every other targeted method.
  //
  // # It returns as soon as the report is recorded
  //
  // The response says what the report triggered, not how those triggers ended:
  // rendering and publishing happen on the server's own queue, and a pipeline
  // step that blocked until a preview was live would be CI waiting on a
  // cluster's convergence for reasons that are not CI's. Where the work went is
  // `triggered`; how it went is EventService, the preview and environment
  // status surfaces, and the commit status kelson writes back
  // (ADR-0034 decision 5).
  rpc ReportBuild(ReportBuildRequest) returns (ReportBuildResponse);
}
