apiVersion: kelson.dev/v1alpha1
kind: Project
metadata:
  name: billing

# One project, three environments with three different delivery modes — the
# practical shape of the hybrid decision (ADR-0001, issue #25).
spec:
  source:
    git: https://github.com/acme/billing
  build:
    strategy: dockerfile

  env:
    CURRENCY: EUR

  # A `services:` block and its `from:` bindings belong here and return with
  # M9; secret backends return with M8. kelson rejects unimplemented fields
  # rather than ignoring them (#141), so they are absent rather than decorative.

  applications:
    - name: api
      port: 3000
      health: /livez
      replicas: { min: 1 }
