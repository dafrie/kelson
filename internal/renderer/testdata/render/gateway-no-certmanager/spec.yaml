# Fixture: Gateway API cluster without cert-manager. TLS is still requested,
# but no Certificate is emitted — nothing would reconcile it, and the HTTPRoute
# carries no TLS of its own (termination belongs to the Gateway listener).
# Fixed replica counts exercise Deployment `replicas:` with no HPA, and the
# environment's explicit gatewayClass is not the profile's first class, so the
# spec's choice must win over detection order. Converted from the former
# ingress-no-certmanager fixture (#140).
apiVersion: kelson.dev/v1alpha1
kind: Project
metadata:
  name: shopfront
spec:
  image: registry.acme.run/shopfront:3.1.0
  # The cache service and its CACHE_URL binding are gated until M9 (#141).
  applications:
    - name: web
      port: 3000
      health: /up
      replicas: { min: 3 }
      resources:
        requests: { cpu: 250m, memory: 256Mi }
        limits: { cpu: "1", memory: 512Mi }
    - name: images
      command: ["shopfront", "process-images"]
---
apiVersion: kelson.dev/v1alpha1
kind: Environment
metadata:
  name: production
spec:
  project: shopfront
  namespace: shopfront
  routing:
    domainSuffix: shop.acme.io
    gatewayClass: public
    tls: true
