name: docs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "website/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "website/**"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      # The site reads the markdown in docs/ in place, so the whole repo
      # checkout is the build input, not just website/.
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: website/build
          # Keep .nojekyll — upload-artifact drops hidden files by default.
          include-hidden-files: true

  deploy:
    # Publish to the gh-pages branch on push to main and on manual dispatch;
    # PR builds only validate (the `build` job) and never publish. Branch-based
    # publishing rather than actions/deploy-pages because creating the Pages
    # site through the API needs repo-admin rights the workflow token doesn't
    # have — pushing a gh-pages branch enables Pages with that branch as the
    # publishing source, so the first deploy needs no manual setup in the UI.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: build
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build
          # The published tree is a build product; one commit of history is
          # enough and keeps the branch from growing without bound.
          force_orphan: true
