{{- include "kelson.authGate" . -}}
{{- if and .Values.auth.password (not (and .Values.auth.existingSecret .Values.auth.existingSecret.name)) }}
# Created only when auth.password is a literal in values. The value is in the
# Helm release record either way, which is why auth.existingSecret is the
# documented preference (values.yaml, README.md).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kelson.passwordSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kelson.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.auth.password | quote }}
{{- end }}
