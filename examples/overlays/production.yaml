apiVersion: kelson.dev/v1alpha1
kind: Environment
metadata:
  name: production

spec:
  project: streaming
  namespace: streaming

  routing:
    domainSuffix: acme.com
    gatewayClass: envoy

  delivery:
    mode: flux
    git:
      repo: git@github.com:acme/streaming-deploy.git
      branch: main
      path: streaming/production

  # `policy: {agents: propose-only}` returns with M7 (#141).

  components:
    - name: transcoder
      replicas: { min: 2, max: 8 }
