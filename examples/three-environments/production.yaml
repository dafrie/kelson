apiVersion: kelson.dev/v1alpha1
kind: Environment
metadata:
  name: production

# Argo CD mode. The policy that would have agents propose pull requests here
# returns with M7, SOPS-encrypted secrets with M8 and the HA database preset
# with M9; kelson rejects unimplemented fields rather than ignoring them (#141).
spec:
  project: billing
  namespace: billing-prod

  routing:
    domainSuffix: billing.acme.com
    gatewayClass: envoy
    tls: true

  delivery:
    mode: argocd
    git:
      repo: git@github.com:acme/billing-deploy.git
      branch: main
      path: billing/production

  applications:
    - name: api
      replicas: { min: 3, max: 50 }
      resources:
        requests: { cpu: 250m, memory: 256Mi }
      env:
        LOG_LEVEL: warning    # innermost scope wins (P1)
