apiVersion: kelson.dev/v1alpha1
kind: Project
metadata:
  name: checkout

# The shape docs/architecture.md targets: one HA, TLS-terminated,
# database-backed service with a worker and a cron job, with no duplication.
spec:
  source:
    git: https://github.com/acme/checkout
    ref: main
  build:
    strategy: auto            # auto | dockerfile | buildpacks | none

  env:                        # shared by every application
    LOG_LEVEL: info

  # An HA postgres service and the `DATABASE_URL: {from: {service: db, key: uri}}`
  # binding that ADR-0009 prescribes belong here. Both return with M9 — until
  # then kelson rejects them rather than rendering a binding to a Secret nothing
  # creates (#141).

  applications:
    - name: web
      port: 8080
      health: /healthz
      domains: [checkout.acme.com]
      replicas: { min: 2, max: 10 }

    - name: worker
      command: ["bundle", "exec", "sidekiq"]

    - name: nightly-report
      schedule: "0 3 * * *"

  defaults:                   # fallbacks only; Environment values always win (P4)
    deliveryMode: flux
    # A `policy:` default belongs here too; it returns with M7 (#141).
