# golangci-lint configuration.
#
# The renderer-purity rule (issues #18, #20) is the load-bearing constraint:
# internal/renderer must stay a deterministically pure function with no
# Kubernetes client, no network, no clock and no ambient filesystem access.

version: "2"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - depguard
    - gocritic
  settings:
    depguard:
      rules:
        renderer-purity:
          files:
            - "**/internal/renderer/**"
            # Test files are exempt (the golden harness must read testdata);
            # the deny-list still governs everything the renderer ships.
            - "!$test"
          deny:
            - pkg: "k8s.io/client-go"
              desc: "renderer must be pure: importing a Kubernetes client breaks determinism and golden tests (issue #20)"
            - pkg: "sigs.k8s.io/controller-runtime"
              desc: "renderer must be pure: importing controller-runtime breaks determinism (issue #20)"
            - pkg: "net/http"
              desc: "renderer must be pure: no network access (issue #20)"
            # The "$" suffix anchors to an exact package match (depguard pkg
            # entries are prefixes otherwise, so "os" alone would also ban
            # os/exec). Regex `regex:` entries cannot be used here at all:
            # golangci-lint's depguard glue maps them to an empty pkg key
            # and panics. Semantics are identical to ^(os|io|time)$.
            - pkg: "os$"
              desc: "renderer must be pure: no ambient filesystem/env inputs — issue #20"
            - pkg: "io$"
              desc: "renderer must be pure: no ambient inputs — issue #20"
            - pkg: "time$"
              desc: "renderer must be pure: no clock access — issue #20"
            - pkg: "math/rand"
              desc: "renderer must be deterministic: inject a seeded source or none at all (issue #20)"
        main:
          files:
            - $all
            - "!**/internal/delivery/**"
            - "!**/internal/observation/**"
            - "!**/internal/clusterprofile/detect/**"
            - "!**/internal/controlstore/**"
            - "!**/internal/gitref/**"
            - "!**/internal/secret/**"
            - "!**/internal/sops/**"
            - "!**/internal/api/**"
            - "!**/internal/mcp/**"
            - "!**/cmd/kelson/**"
            - "!**/cmd/kelson-server/**"
            - "!**/cmd/kelson-mcp/**"
            - "!**/api/kelson/**"
            - "!**/internal/controller/**"
            - "!**/cmd/kelson-controller/**"
            - "!**/internal/forge/**"
            - "!**/internal/forgehttp/**"
          allow:
            - $gostd
            - github.com/dafrie/kelson
            - github.com/invopop/jsonschema
            - github.com/spf13/cobra
            - gopkg.in/yaml.v3
            # Terminal detection only (an ioctl behind a portable API). The
            # CLI's confirmation gates must distinguish a human's terminal
            # from /dev/null, and /dev/null is a character device — a
            # file-mode sniff cannot tell them apart (cmd/kelson/deploy.go,
            # interactive).
            - golang.org/x/term
        # cmd/kelson (R2, issue #225): deploy, rollback, promote and history are
        # a ConnectRPC client of kelson-server now — the direct/git adapters
        # they used to drive are deleted (ADR-0028) — so the CLI binary gets its
        # own rule, one step wider than `main`, rather than handing the wire
        # client to every other main-governed package (internal/model,
        # internal/renderer, ...) that has no business dialling a server. It is
        # the same fence internal/mcp/cmd/kelson-mcp draws from the other side
        # (see the api rule below); cmd/kelson does not get the MCP SDK because
        # it is not an MCP surface.
        cli:
          files:
            - "**/cmd/kelson/**"
          allow:
            - $gostd
            - github.com/dafrie/kelson
            - github.com/invopop/jsonschema
            - github.com/spf13/cobra
            - gopkg.in/yaml.v3
            - golang.org/x/term
            - connectrpc.com/connect
        # The cluster-facing planes. internal/observation watches live
        # resources by definition and internal/clusterprofile/detect probes one
        # (docs/architecture.md), so both need the same client libraries as
        # delivery. The renderer still gets none of them, and neither does
        # internal/clusterprofile itself — the profile *type* stays pure so the
        # renderer can import it. Only its detect/ subpackage is listed here.
        delivery:
          files:
            - "**/internal/delivery/**"
            - "**/internal/observation/**"
            - "**/internal/clusterprofile/detect/**"
            - "**/internal/gitref/**"
            # ADR-0013: all kelson-server state is cluster state. The agent and
            # audit stores are ConfigMap and Secret clients, so they belong to
            # the cluster-facing plane rather than the api plane below. The spec
            # store beside them speaks custom resources and needs one library
            # more; it is fenced separately below.
            - "**/internal/controlstore/**"
            # ADR-0009's cluster secret backend (issue #116). It writes a
            # Secret through the Kubernetes API and reads it back masked, so it
            # is a cluster client by definition — the same reason controlstore
            # is here rather than under internal/api.
            - "**/internal/secret/**"
          allow:
            - $gostd
            - github.com/dafrie/kelson
            - k8s.io/client-go
            - k8s.io/api
            - k8s.io/apimachinery
            - sigs.k8s.io/yaml
            # internal/controlstore's spec store is typed over the kelson.dev
            # custom resources (ADR-0027 decision 6), which needs a client the
            # typed clientset cannot give. controller-runtime's is the one this
            # repository already depends on and already fakes in
            # internal/controller's tests, so the store uses it rather than
            # hand-rolling unstructured conversions — and it stays behind the
            # SpecStore seam, so no handler ever sees it.
            - sigs.k8s.io/controller-runtime
            # …and yaml.v3, because the store re-serializes a stored spec into
            # the document a user would have written, and the model's yaml tags
            # are what model.DecodeDocuments reads back.
            - gopkg.in/yaml.v3
            # The build plane's `git ls-remote` (internal/gitref). ADR-0028 said
            # choosing OCI "removes go-git", and that is true of the transport:
            # nothing commits, pushes or keeps a worktree any more, and
            # go-billy — the writer's in-memory filesystem — went from a direct
            # dependency to an indirect one with it. Resolving a branch to the
            # commit a build records is a different question, it predates the
            # writer, and it is the only reason go-git is still in go.mod.
            - github.com/go-git/go-git/v5
        # The SOPS writer (issue #81, ADR-0021). It gets exactly one library
        # beyond the standard one — filippo.io/age, the reference age
        # implementation — because the alternative was importing
        # github.com/getsops/sops/v3, which drags in the AWS, Azure, GCP and
        # Vault SDKs (98 modules) for a package that encrypts a two-key Secret.
        # It gets no cluster client and no git client on purpose: encryption is
        # a pure byte transformation and everything that decides *where* the
        # result is written lives in internal/secret.
        sops:
          files:
            - "**/internal/sops/**"
          allow:
            - $gostd
            - github.com/dafrie/kelson
            - gopkg.in/yaml.v3
            - filippo.io/age
        # The forge seam (ADR-0033 decision 3). Its allow-list is one entry
        # narrower than `main`: the standard library and this module, and no
        # forge SDK now or later. What the seam actually needs is a dozen REST
        # calls, one RS256-signed assertion and an HMAC — go-github and an OAuth
        # stack would be an SDK-sized module tree for that, which is the same
        # dependency-weight rule the sops rule above answers to (ADR-0022,
        # ADR-0030). It is also the fence a second adapter meets: GitLab and
        # Forgejo are written against net/http here, not against their vendors'
        # clients.
        forge:
          files:
            - "**/internal/forge/**"
          allow:
            - $gostd
            - github.com/dafrie/kelson
        # The forge's HTTP surface (ADR-0033 decision 2, ADR-0034 decisions 1
        # and 2): the app-manifest flow and the webhook listener, mounted on
        # kelson-server's mux. It is deliberately NOT under the `forge` rule
        # above — that package is the provider seam and gets the standard
        # library alone, and a webhook endpoint that could reach a cluster from
        # inside it would erase the property that makes the seam testable
        # against fixtures.
        #
        # What it needs beyond `main` is one Secret write in kelson's own
        # namespace (the created app's private key) and the dynamic client that
        # stamps a ResourceSetInputProvider. That is the cluster-facing plane's
        # own list, minus controller-runtime, which nothing here builds an apply
        # configuration with.
        forgehttp:
          files:
            - "**/internal/forgehttp/**"
          allow:
            - $gostd
            - github.com/dafrie/kelson
            - k8s.io/client-go
            - k8s.io/api
            - k8s.io/apimachinery
        # The api plane (ADR-0013 §2): the ConnectRPC handlers and the server
        # binary. It gets the transport and the generated code, and nothing
        # else — the cluster clients stay behind the store interfaces in
        # internal/controlstore, so a handler cannot reach for a client-go call
        # instead of going through the store.
        # The api plane and its clients. internal/mcp and cmd/kelson-mcp are
        # here rather than in a rule of their own because they are the same
        # fence seen from the other side: the MCP surface is a composition of
        # ConnectRPC calls against this schema (ADR-0008), so it gets the
        # transport, the generated code and the MCP SDK — and no cluster client,
        # which is what keeps a tool from reaching past the API it claims to
        # compose (issue #73).
        api:
          files:
            - "**/internal/api/**"
            - "**/internal/mcp/**"
            - "**/cmd/kelson-server/**"
            - "**/cmd/kelson-mcp/**"
          allow:
            - $gostd
            - github.com/dafrie/kelson
            - connectrpc.com/connect
            - google.golang.org/protobuf
            - github.com/modelcontextprotocol/go-sdk
        # The controller plane (ADR-0027, ADR-0028): the CRD wrappers, the
        # reconcilers and the controller binary. It gets controller-runtime and
        # the Kubernetes libraries and nothing else — in particular no
        # jsonschema and no cobra, because a reconciler neither generates a
        # schema nor parses a command line, and no forge or registry client,
        # because publishing is still stubbed behind an interface (issue #224)
        # and the dependency lands with the implementation.
        #
        # api/kelson/** is the one plane outside cmd/ that is NOT internal/: a
        # CRD's Go types are what other people's controllers import (ADR-0027
        # decision 3), which is why the spec structs stay in internal/model and
        # only the wrappers live there. It is listed here rather than under
        # `main` because metav1 cannot go into the authoring plane.
        controller:
          files:
            - "**/api/kelson/**"
            - "**/internal/controller/**"
            - "**/cmd/kelson-controller/**"
          allow:
            - $gostd
            - github.com/dafrie/kelson
            - sigs.k8s.io/controller-runtime
            - k8s.io/api
            - k8s.io/apimachinery
            - k8s.io/client-go
            - sigs.k8s.io/yaml
            # controller-runtime's API is written in logr, so a binary that
            # wants its own log lines to look like every other kelson
            # binary's has to hand it a logr.Logger. This is the bridge
            # (logr.FromSlogHandler) and nothing else — the alternative was
            # controller-runtime's zap helper, which would put go.uber.org/zap
            # in go.mod for one call in one main.
            - github.com/go-logr/logr

