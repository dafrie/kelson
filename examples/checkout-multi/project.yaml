apiVersion: kelson.dev/v1alpha1
kind: Project
metadata:
  name: checkout

# The shape docs/architecture.md targets: one HA, TLS-terminated,
# database-backed service with a worker and a cron job, with no duplication.
spec:
  source:
    git: https://github.com/acme/checkout
    ref: main
  build:
    strategy: auto            # auto | dockerfile | buildpacks | none

  env:                        # shared by every component
    LOG_LEVEL: info
    # A reference, never a value (ADR-0009). It renders as a secretKeyRef
    # against the credentials CloudNativePG generates for the cluster below —
    # kelson never holds the password.
    DATABASE_URL: { from: { service: db, key: uri } }

  # One list, kinds tell them apart (ADR-0014). Workload kinds derive from the
  # shape; a data component says what it is, because nothing could derive it.
  components:
    - name: db
      kind: postgres          # topology is the operator's job (ADR-0005, ADR-0007)
      preset: ha-small        # 3 instances, synchronous; see docs/data-services.md

    - name: web
      port: 8080
      health: /healthz
      domains: [checkout.acme.com]
      replicas: { min: 2, max: 10 }

    - name: worker
      command: ["bundle", "exec", "sidekiq"]

    - name: nightly-report
      schedule: "0 3 * * *"

  # `defaults:` holds Project-level fallbacks an Environment value always beats
  # (P4). It carried `deliveryMode:` until ADR-0028 left one delivery path with
  # nothing to choose between; what remains is a `policy:` default, which
  # returns with M7 (#141), and a `secrets:` backend.
