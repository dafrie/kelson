# Fixture: the portability claim, proven (issue #56). This spec.yaml is
# byte-identical to portable-gateway-istio/spec.yaml; only the cluster profile
# in each directory differs. The rendered pair must agree on everything kelson
# emits — the Deployment, Service, labels and provenance annotations — and
# differ only in which Gateway the HTTPRoute attaches to. Since #140 routing is
# Gateway API only, so portability is across Gateway implementations, not
# across routing substrates.
apiVersion: kelson.dev/v1alpha1
kind: Project
metadata:
  name: portable
spec:
  image: ghcr.io/acme/portable:v1
  env:
    LOG_LEVEL: info
  applications:
    - name: web
      port: 8080
      health: /healthz
---
apiVersion: kelson.dev/v1alpha1
kind: Environment
metadata:
  name: production
spec:
  project: portable
  routing:
    domainSuffix: portable.acme.run
