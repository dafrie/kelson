// DeployService: deploy, status, rollback, history (issues #69/#139).
//
// Deploy and Rollback are server-streaming: every state-machine transition is
// an event, and the final event carries the settled state. The stream speaks
// statemachine.State (issue #37: the engine is the single owner of what a
// phase means — the CLI, this API and any UI render the same transitions).
syntax = "proto3";

package kelson.v1alpha1;

import "kelson/v1alpha1/common.proto";
import "kelson/v1alpha1/render.proto";

option go_package = "github.com/dafrie/kelson/internal/api/gen/kelson/v1alpha1;kelsonv1alpha1";

message DeployRequest {
  SpecRef spec = 1;
  string environment = 2;
  ProfileRef profile = 3;
  string image = 4;
  string mode = 5;             // delivery adapter override ("direct", "flux"); empty = spec's mode
  int64 timeout_seconds = 6;   // budget to reach a healthy phase; 0 = server default (5m)
  DryRun dry_run = 7;          // RENDER: render only; SERVER: k8s dry-run apply; NONE: deploy
  string idempotency_key = 8;
}

// DeployResponse streams the deployment as it happens: each message is one event.
message DeployResponse {
  oneof event {
    Proposed proposed = 1;   // first event: what would be / is being applied
    Committed committed = 2; // the apply landed; revision assigned
    Transition transition = 3;
    Settled settled = 4;     // terminal event, exactly one, last
  }

  message Proposed {
    string project = 1;
    string environment = 2;
    int32 resources = 3;
    string mode = 4;
    // Dry-run outcomes end the stream after this event (RENDER) or after a
    // server-side preview Transition (SERVER).
    repeated Manifest manifests = 5; // populated for dry-run render only
  }

  message Committed {
    string revision = 1;
    string adapter = 2;
  }

  // Transition mirrors statemachine.State.
  message Transition {
    string phase = 1;    // delivery.Phase string
    string answer = 2;   // waiting|progressing|live|stuck|rejected|degraded
    bool stuck = 3;
    Cause cause = 4;
    string observed_revision = 5;
    int64 since_unix_ms = 6;
  }

  message Settled {
    Transition final = 1;
    // Structured error when the deployment settled unhealthy; the stream
    // itself completes cleanly — an unhealthy deployment is an answer,
    // not a transport failure (statemachine.Run's contract).
    Error error = 2;
  }

  message Cause {
    string component = 1;
    string reason = 2;
    string message = 3;
  }
}

message StatusRequest {
  SpecRef spec = 1;
  string environment = 2;
  ProfileRef profile = 3;
  string image = 4;
  string mode = 5;
}

message StatusResponse {
  string phase = 1;
  string revision = 2;
  string cause = 3;
  map<string, string> detail = 4; // adapter detail: resources/live/degraded, ...
  repeated WorkloadVerdict verdicts = 5;
  // The resolved environment's namespace. Resolving a spec is the server's job
  // and no other RPC exposes the answer, so a client that needs to address the
  // environment's workloads — the UI's log selector — had to guess it from the
  // model's `<project>-<environment>` default and get a spec.namespace override
  // wrong (#161).
  string namespace = 6;
}

// WorkloadVerdict mirrors observation's classification (the same predicate
// the CLI's summary uses, #151).
message WorkloadVerdict {
  string resource = 1;   // "Deployment/ns/name"
  string code = 2;       // observation health code, e.g. "crash-loop-back-off"
  bool healthy = 3;
  bool degraded = 4;
  string message = 5;
  string remediation = 6;
}

message RollbackRequest {
  SpecRef spec = 1;
  string environment = 2;
  ProfileRef profile = 3;
  string mode = 4;
  string to_revision = 5;     // empty = previous revision
  DryRun dry_run = 6;         // RENDER = preview only (the CLI always previews; so does the API)
  string idempotency_key = 7;
}

// RollbackResponse streams: preview first (always), then the apply outcome unless dry-run.
message RollbackResponse {
  oneof event {
    Preview preview = 1;
    Committed committed = 2;
    Settled settled = 3;
  }

  message Preview {
    string to_revision = 1;
    bytes diff_json = 2;             // diff.EncodeJSON of what changes
    repeated Finding findings = 3;   // what a rollback cannot revert
  }

  message Finding {
    string resource = 1;
    string path = 2;
    string cause = 3;   // rollback.Cause vocabulary
    string message = 4;
    bool unrecoverable = 5;
  }

  message Committed {
    string restored_revision = 1; // the revision restored
    string as_revision = 2;       // the new history entry it was recorded as
  }

  message Settled {
    Error error = 1; // set when the rollback failed
  }
}

message HistoryRequest {
  SpecRef spec = 1;
  string environment = 2;
  string mode = 3;
}

message HistoryResponse {
  repeated HistoryEntry entries = 1; // newest first, like the adapters
}

message HistoryEntry {
  string revision = 1;
  string spec_hash = 2;
  string committed_at = 3;
  string message = 4;
  string author = 5;
}

// Promotion (issue #11, ADR-0016 decision 2). Promoting is reading the digest
// the source environment deployed, writing it as the target environment's
// image pin, and deploying through the ordinary path. This RPC is the first
// two; the third is Deploy, unchanged.
//
// It lives on DeployService because its input is a delivery revision: the
// images promoted are extracted from the manifests the source environment's
// latest revision recorded, which is the same history History and Rollback
// read. Putting it on SpecService would have made the spec store depend on the
// delivery plane to answer one call.
message PromoteRequest {
  // Project names the stored spec. Promotion writes a spec document, so there
  // is no inline-documents form: there would be nowhere to write it back to.
  string project = 1;
  string from_environment = 2;   // where the deployed digest is read
  string to_environment = 3;     // where the pin is written
  // Components restricts the promotion. Empty promotes every workload
  // component the project declares; a name the project does not declare is
  // promote/component-unknown rather than a silent no-op.
  repeated string components = 4;
  ProfileRef profile = 5;        // renders the before/after diff below
  string mode = 6;               // delivery adapter override for reading the source's history
  DryRun dry_run = 7;            // RENDER: compute the pins and the diff, write nothing
  string idempotency_key = 8;
  // Version is the spec version the caller read before promoting; a mismatch
  // fails with store/version-conflict, the same optimistic concurrency PutSpec
  // carries.
  string version = 9;
}

message PromoteResponse {
  // Components is every component the promotion considered, in the Project's
  // own order, including the ones it did not write.
  repeated PromotedComponent components = 1;
  // FromRevision is the source environment's revision the images were read
  // from — the deployed truth this promotion is built on.
  string from_revision = 2;
  // Version is the spec store's version after the write. Empty for a dry run,
  // which stores nothing.
  string version = 3;
  // The diff of the target environment, before and after the pins, computed
  // server-side and encoded like DiffResponse.diff_json. The promotion returns
  // it rather than leaving the caller to call Diff: the two document sets are
  // already in the server's hands here, and a dry run has no stored "after"
  // for a follow-up Diff to compare against.
  bytes diff_json = 4;
  int32 exit_semantics = 5; // 0 no changes, 2 changes, 3 blocked — as DiffResponse
  // Validation and render findings. A non-empty list means nothing was
  // written, the same contract PutSpec has.
  repeated Error errors = 6;
}

// PromotionStatus is what the promotion decided for one component.
enum PromotionStatus {
  PROMOTION_STATUS_UNSPECIFIED = 0;
  PROMOTION_STATUS_PINNED = 1;    // the pin was (or would be) written
  PROMOTION_STATUS_UNCHANGED = 2; // already pinned to what the source runs
  PROMOTION_STATUS_SKIPPED = 3;   // not promoted, and `code`/`reason` say why
}

message PromotedComponent {
  string component = 1;
  // FromImage is the target environment's pin before the promotion; empty
  // means it was unpinned and following the component or project image.
  string from_image = 2;
  // ToImage is the image the source environment's latest revision runs.
  string to_image = 3;
  PromotionStatus status = 4;
  string code = 5;   // promote/* code for a skip, e.g. "promote/not-in-revision"
  string reason = 6; // the skip in prose
}

service DeployService {
  rpc Deploy(DeployRequest) returns (stream DeployResponse);
  rpc Status(StatusRequest) returns (StatusResponse);
  rpc Rollback(RollbackRequest) returns (stream RollbackResponse);
  rpc History(HistoryRequest) returns (HistoryResponse);
  rpc Promote(PromoteRequest) returns (PromoteResponse);
}
