# kelson CI pipeline (issues #19, #20).
#
# - Go: lint (golangci-lint v2 with depguard renderer-purity rule), race tests,
#   coverage, cross-compiled build matrix, govulncheck.
# - TypeScript UI: strict typecheck, vitest, and a production build of ui/.
# - Docs-only fast path skips the heavy Go/TS jobs via native git change
#   detection (no third-party action).
# - Required status checks on the default branch are configured in GitHub
#   repository settings; the `CI` job aggregates the required outcomes.

name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed files
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      go: ${{ steps.classify.outputs.go }}
      typescript: ${{ steps.classify.outputs.typescript }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            MERGE_BASE="$(git merge-base "$BASE_REF" "$GITHUB_SHA")"
            CHANGED="$(git diff --name-only "$MERGE_BASE" "$GITHUB_SHA")"
          else
            CHANGED="$(git diff --name-only "${BEFORE:-HEAD~1}" "$GITHUB_SHA")"
          fi

          go="false"
          typescript="false"
          docs="false"
          for f in $CHANGED; do
            case "$f" in
              *.go|go.mod|go.sum|.golangci.yml|Makefile)
                go="true"
                ;;
              ui/*)
                typescript="true"
                ;;
              # website/ is the Docusaurus docs site. It has no Go impact, so it
              # belongs on the docs fast path; its own build runs in docs.yml.
              # Without this it matched nothing, so a website-only change ran the
              # full Go pipeline and skipped the site build entirely.
              *.md|docs/*|website/*)
                docs="true"
                ;;
            esac
          done

          if [ "$docs" = "true" ] && [ "$go" != "true" ] && [ "$typescript" != "true" ]; then
            docs_only="true"
          else
            docs_only="false"
          fi

          {
            echo "go=$go"
            echo "typescript=$typescript"
            echo "docs=$docs"
            echo "docs_only=$docs_only"
          } >> "$GITHUB_OUTPUT"

  lint:
    name: Go lint
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install golangci-lint v2
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Run golangci-lint
        run: golangci-lint run ./...

  test:
    name: Go test with race detector
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests with race detector
        run: go test -race ./...

  coverage:
    name: Go coverage
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Generate coverage profile
        run: go test -race -coverprofile=coverage.out ./...

      - name: Report coverage
        run: go tool cover -func=coverage.out

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out
          if-no-files-found: error

  vuln:
    name: Vulnerability scan
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  build:
    name: Build binaries (${{ matrix.os }}/${{ matrix.arch }})
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build all binaries
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: go build ./...

  typescript:
    name: TypeScript UI
    needs: changes
    if: ${{ needs.changes.outputs.typescript == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      # tsc in strict mode is the lint story for the UI; there is no ESLint or
      # Prettier in v0 and no repo precedent for either.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test -- --run

      - name: Build
        run: npm run build

  ci:
    name: CI summary
    needs: [changes, lint, test, coverage, vuln, build, typescript]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Evaluate required outcomes
        env:
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
          COVERAGE: ${{ needs.coverage.result }}
          VULN: ${{ needs.vuln.result }}
          BUILD: ${{ needs.build.result }}
          TS: ${{ needs.typescript.result }}
        run: |
          if [ "$DOCS_ONLY" = "true" ]; then
            echo "Docs-only change; heavy checks skipped by fast path."
            exit 0
          fi

          failed=0
          for pair in "lint:$LINT" "test:$TEST" "coverage:$COVERAGE" "vuln:$VULN" "build:$BUILD" "typescript:$TS"; do
            name="${pair%%:*}"
            result="${pair#*:}"
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "Job $name failed with result: $result"
              failed=1
            fi
          done

          if [ "$failed" != "0" ]; then
            exit 1
          fi
          echo "All required CI jobs passed."
