{{- include "kelson.authGate" . -}}
{{- if .Values.controller.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kelson.controller.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kelson.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  # One replica, and the controller's own default matches: while it only writes
  # statuses, two replicas would compute the same verdict and write the same
  # patch. Turn on controller.leaderElection.enabled before scaling up — and it
  # becomes required, not optional, once delivery is real (issue #224), because
  # two processes pushing artifacts is a race.
  replicas: {{ .Values.controller.replicaCount }}
  selector:
    matchLabels:
      {{- include "kelson.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        {{- include "kelson.labels" . | nindent 8 }}
        app.kubernetes.io/component: controller
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "kelson.controller.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: kelson-controller
          image: {{ include "kelson.controller.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --health-probe-bind-address=:{{ .Values.controller.probePort }}
            - --metrics-bind-address={{ .Values.controller.metricsBindAddress }}
            {{- if .Values.controller.leaderElection.enabled }}
            - --leader-elect
            - --leader-election-namespace={{ default .Release.Namespace .Values.controller.leaderElection.namespace }}
            {{- end }}
            {{- with .Values.controller.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.controller.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: probe
              containerPort: {{ .Values.controller.probePort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: probe
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: probe
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          {{- with .Values.controller.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
