# Fixture: the dedicated presets (#89). One project, one worker, and two
# postgres services whose presets differ — `small` as authored, and `ha-medium`
# reached through the Environment's P5 preset override of a `small` service.
#
# It pins the sizing table of docs/data-services.md into rendered YAML, and the
# ordering rule: every service CR sorts after the Namespace and before the
# workloads that would bind to it.
#
# No bindings here. Binding rendering is postgres-binding's fixture, so a change
# to the Cluster shape and a change to the secretKeyRef shape fail separately.
apiVersion: kelson.dev/v1alpha1
kind: Project
metadata:
  name: checkout
spec:
  image: ghcr.io/acme/checkout:1.4.2

  services:
    - name: db
      type: postgres
      preset: ha-small
    - name: reporting
      type: postgres
      preset: small

  applications:
    - name: worker
      command: ["bundle", "exec", "sidekiq"]
---
apiVersion: kelson.dev/v1alpha1
kind: Environment
metadata:
  name: production
spec:
  project: checkout
  namespace: checkout-prod

  # P5: the reporting database is bigger in production than the Project asks
  # for. One spec, different topology per environment (ADR-0007).
  services:
    - name: reporting
      preset: ha-medium
