# Fixture: the build path (spec.source + spec.build) with the built artifact
# supplied — what `kelson render --image <ref>` produces once a build has run
# (issue #136). The image is pinned by digest, which is what the build plane
# hands back, and every workload must carry that reference verbatim: the
# unresolved placeholder never reaches a manifest.
apiVersion: kelson.dev/v1alpha1
kind: Project
metadata:
  name: checkout
spec:
  source:
    git: https://github.com/acme/checkout
    ref: main
  build:
    strategy: dockerfile
  image: ghcr.io/acme/checkout@sha256:9f6ad2c1b4d5e8073a1c2f4b6d8e0a1c3e5f7091b2d4c6e8a0f2b4d6c8e0a2f4
  env:
    LOG_LEVEL: info
  components:
    - name: web
      port: 8080
      health: /healthz
    - name: worker
      command: ["bundle", "exec", "sidekiq"]
---
apiVersion: kelson.dev/v1alpha1
kind: Environment
metadata:
  name: production
spec:
  project: checkout
  namespace: checkout-production
  delivery:
    mode: direct
