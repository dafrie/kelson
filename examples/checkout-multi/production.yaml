apiVersion: kelson.dev/v1alpha1
kind: Environment
metadata:
  name: production

spec:
  project: checkout
  namespace: checkout-prod

  routing:
    domainSuffix: acme.com
    gatewayClass: envoy
    tls: true

  delivery:
    mode: flux                # applications ride pull requests into production
    git:
      repo: git@github.com:acme/deploy.git
      branch: main
      path: checkout/production

  policy:
    agents: propose-only      # agents open PRs; humans merge
    deployers: [team-checkout]

  secrets:
    backend: sops             # encrypted in Git, age keys held by CI

  applications:
    - name: web
      replicas: { min: 3, max: 20 }
      resources:
        requests: { cpu: 500m, memory: 512Mi }
        limits: { memory: 1Gi }
    - name: worker
      env:
        CONCURRENCY: "10"
