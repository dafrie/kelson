apiVersion: kelson.dev/v1alpha1
kind: Environment
metadata:
  name: production

spec:
  project: checkout
  namespace: checkout-prod

  routing:
    domainSuffix: acme.com
    gatewayClass: envoy
    tls: true

  # `policy:` (agents open PRs, humans merge) returns with M7 and `secrets:`
  # (SOPS-encrypted in Git) with M8. kelson rejects unimplemented fields rather
  # than ignoring them (#141).

  components:
    - name: web
      replicas: { min: 3, max: 20 }
      resources:
        requests: { cpu: 500m, memory: 512Mi }
        limits: { memory: 1Gi }
    - name: worker
      env:
        CONCURRENCY: "10"
