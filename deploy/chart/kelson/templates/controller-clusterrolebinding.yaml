{{- include "kelson.authGate" . -}}
{{- if and .Values.controller.enabled .Values.controller.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kelson.controller.fullname" . }}
  labels:
    {{- include "kelson.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kelson.controller.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kelson.controller.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
