# A cluster running Flux, helm-controller included. The renderer does not read
# any of this to decide whether the helm component renders — that gate is the
# environment's delivery mode, which is spec data (ADR-0016, helm.go). The
# profile is here because the capability judgement in
# internal/clusterprofile/helm reads exactly these facts for the surfaces that
# report "helm components need helm-controller: present/absent/version", and a
# fixture that showed an empty cluster hosting a HelmRelease would be a
# misleading picture of a working install.
flux:
  version: 2.6.4
  namespace: flux-system
helmController:
  version: 1.3.0
  namespace: flux-system
  crds: [helmreleases]
