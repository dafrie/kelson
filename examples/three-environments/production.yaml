apiVersion: kelson.dev/v1alpha1
kind: Environment
metadata:
  name: production

# The same Project again, with the replica floor, the resource requests and the
# env override this environment needs (P1, P2, P3). The policy that would have
# agents propose pull requests here returns with M7, SOPS-encrypted secrets with
# M8 and the HA database preset with M9; kelson rejects unimplemented fields
# rather than ignoring them (#141).
spec:
  project: billing
  namespace: billing-prod

  routing:
    domainSuffix: billing.acme.com
    gatewayClass: envoy
    tls: true

  components:
    - name: api
      replicas: { min: 3, max: 50 }
      resources:
        requests: { cpu: 250m, memory: 256Mi }
      env:
        LOG_LEVEL: warning    # innermost scope wins (P1)
