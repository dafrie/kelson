{{- include "kelson.authGate" . -}}
{{- if and .Values.controller.enabled .Values.controller.rbac.create }}
# The controller's cluster-scoped grant: read the two kelson kinds and write
# their status and finalizer anywhere in the cluster (ADR-0028 steps 1–6). The
# Flux objects the delivery spine writes are a *namespaced* grant instead —
# templates/controller-flux-role.yaml, in .Values.controller.fluxNamespace —
# because kelson owns exactly one OCIRepository/Kustomization pair per
# environment, always in that one namespace, and a namespaced Role is the
# smaller grant for that shape.
#
# Cluster-scoped rather than namespaced because a Project and its Environments
# live wherever their team's namespace is, and a controller that watched only
# the release namespace would silently ignore every other one.
#
# Deliberately, still, no access to Secrets, and no *write* anywhere outside
# kelson's own kinds. The read-only workload grant below is the one thing that
# arrived after this comment was first written (issue #240), and it arrived
# with the code that uses it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kelson.controller.fullname" . }}
  labels:
    {{- include "kelson.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
rules:
  # The specs it reconciles. Read-only: the status subresource below, and the
  # one metadata.finalizers patch after it, are the only things the controller
  # writes — which is the separation ADR-0027 decision 1 gives the status
  # subresource credit for, a controller that does not write a spec cannot race
  # the user who authored it.
  - apiGroups: ["kelson.dev"]
    resources: ["projects", "environments"]
    verbs: ["get", "list", "watch"]

  # The instance's declared sources (ADR-0035 decision 2). GitSourceReconciler
  # validates one and records the verdict, which is the whole of what it does —
  # so read plus the status write below, and nothing else. Cluster-scoped like
  # the rule above rather than narrowed to the release namespace: the manager's
  # cache watches kelson's kinds cluster-wide (cmd/kelson-controller's
  # cacheOptions), and an informer that cannot list is one that never syncs.
  - apiGroups: ["kelson.dev"]
    resources: ["gitsources"]
    verbs: ["get", "list", "watch"]

  # The deletion blocker, on the main resource, because that is where a CRD
  # keeps it.
  #
  # `environments/finalizers` below is the kubebuilder convention and some
  # admission paths do consult it, but a CustomResourceDefinition serves no
  # `/finalizers` endpoint, so it authorizes nothing on its own: the write
  # EnvironmentReconciler.addFinalizer actually issues is a merge PATCH against
  # `environments`, and RBAC checks it against *this* rule. Granting only the
  # subresource is what the first e2e run of the delivery spine caught —
  # `environments.kelson.dev "live" is forbidden: … cannot patch resource
  # "environments"` on every reconcile, forever, with the artifact published
  # and Flux healthy but `.status` never written because the reconcile
  # returned before it got there.
  #
  # `patch` and not `update`: every write here is a merge patch, and a verb
  # nothing calls is a verb that should not be granted. Projects are not listed
  # — the Project reconciler holds no finalizer (internal/controller/project.go)
  # and must stay unable to write a spec.
  - apiGroups: ["kelson.dev"]
    resources: ["environments"]
    verbs: ["patch"]

  # What it observed. `update` beside `patch` because a future reconciler may
  # need to replace a status wholesale; today every write is a merge patch.
  - apiGroups: ["kelson.dev"]
    resources: ["projects/status", "environments/status", "gitsources/status"]
    verbs: ["get", "patch", "update"]

  # The kubebuilder/controller-runtime spelling of the same deletion blocker
  # (internal/controller/environment.go's Finalizer, `kelson.dev/environment`):
  # added on the first successful Ensure, removed only after Teardown has
  # deleted both Flux objects. Kept beside the `environments` patch above
  # because some admission paths do check it, but it is that rule and not this
  # one that authorizes the write — see the note there.
  - apiGroups: ["kelson.dev"]
    resources: ["environments/finalizers"]
    verbs: ["update"]

  # The workload readback (ADR-0028 decision 1 step 6, issue #240). Read-only,
  # and the two resources internal/observation's classifier actually reads:
  # Deployments, selected by kelson's own provenance labels, and the Pods in
  # each one's selector set. That is what turns "the Kustomization is not
  # ready" into "Deployment/checkout-production/web is crash-loop-back-off,
  # container app in pod web-6d4f-abc" without anybody running three more
  # commands (internal/controller/workloads.go).
  #
  # Cluster-scoped because a workload namespace is per-environment and named by
  # the spec — `<project>-<environment>` by default, anything the author chose
  # otherwise — so there is no fixed set of namespaces a Role could cover.
  #
  # What is NOT here is the point of the rule:
  #
  #   - **No `watch`.** The readback is a direct client, not an informer: one
  #     list per reconcile, on a loop that already has a requeue. Granting
  #     `watch` would let this controller stream every pod event in the cluster
  #     for a capability nothing calls, and a verb nothing calls is a verb that
  #     should not be granted.
  #   - **No `pods/log`.** Container logs are where a connection string leaks,
  #     and an Environment's status is readable by anyone who can read the
  #     Environment. The readback names the pod and the container and stops
  #     there; `kelson logs` reads the output, under the server's own grant
  #     (templates/clusterrole-deploy.yaml), which an operator opts into.
  #   - **No StatefulSets, Jobs or CronJobs.** internal/observation classifies a
  #     Deployment against the pods in its selector set and nothing else, so a
  #     grant over the other kinds would be a grant with no reader. They stay
  #     covered by the Kustomization's `wait: true`, which is coarser and true.
  #   - **No write verb of any kind.** Observation observes.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]

  # Events. controller-runtime's manager gives leader election an event
  # recorder whether or not a reconciler ever calls Eventf, and it emits into
  # whichever namespace the involved object lives in — the Lease's namespace
  # today, an Environment's namespace as soon as a reconciler records anything
  # — which is why this is cluster-scoped rather than a Role next to the Lease.
  #
  # Without it the first e2e run of the delivery spine logged
  # `events is forbidden: … cannot create resource "events" in API group ""`
  # at start-up, and `kubectl describe environment` had nothing to show a user
  # asking why their environment was stuck. Write-only, and no `get`/`list`:
  # the controller records events, it never reads them back.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
{{- if .Values.controller.leaderElection.enabled }}

  # Leader election, and only when it is on. The Lease is namespaced, so this
  # could be a Role — it is here so that one binding covers a
  # leaderElectionNamespace outside the release namespace, which is the case an
  # operator running the controller apart from the server would hit.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
{{- end }}
{{- end }}
