# Fixture: a bare cluster — no gateway API, no ingress class, no
# cert-manager, no prometheus. Only workloads render: a queue worker and two
# cron components (derived from examples/worker-cron).
#
# It is also where per-component identity is pinned for the kinds that used to
# have none (ADR-0014 decision D): a worker and a cron each render their own
# ServiceAccount and name it in the pod template, rather than inheriting the
# namespace's `default`.
apiVersion: kelson.dev/v1alpha1
kind: Project
metadata:
  name: mailroom
spec:
  image: registry.acme.run/mailroom:2.0.7
  # The queue service and its QUEUE_URL/QUEUE_PASSWORD bindings are gated
  # until M9 (#141).
  components:
    - name: worker
      command: ["mailroom", "work"]
      replicas: { min: 2 }
    - name: digest
      schedule: "30 6 * * 1-5"
      command: ["mailroom", "send-digests"]
    - name: retention-sweep
      schedule: "15 2 * * *"
      command: ["mailroom", "sweep", "--older-than=90d"]
---
apiVersion: kelson.dev/v1alpha1
kind: Environment
metadata:
  name: production
spec:
  project: mailroom
  namespace: mailroom
  delivery:
    mode: direct
  components:
    - name: worker
      resources:
        requests: { cpu: 100m, memory: 128Mi }
        limits: { memory: 512Mi }
