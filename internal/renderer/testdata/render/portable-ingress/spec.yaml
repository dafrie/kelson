# Fixture: the portability claim, proven (issue #56). This spec.yaml is
# byte-identical to portable-ingress/spec.yaml; only the cluster profile in
# each directory differs. The rendered pair must agree on everything kelson
# emits — the Deployment, Service, labels and provenance annotations — and
# differ only in the routing resource: HTTPRoute where the cluster has
# Gateway API, Ingress where it only has an ingress class.
apiVersion: kelson.dev/v1alpha1
kind: Project
metadata:
  name: portable
spec:
  image: ghcr.io/acme/portable:v1
  env:
    LOG_LEVEL: info
  applications:
    - name: web
      port: 8080
      health: /healthz
---
apiVersion: kelson.dev/v1alpha1
kind: Environment
metadata:
  name: production
spec:
  project: portable
  routing:
    domainSuffix: portable.acme.run
