apiVersion: kelson.dev/v1alpha1
kind: Project
metadata:
  name: streaming
spec:
  image: ghcr.io/acme/streaming:0.9.1
  # The cache service and its REDIS_URL binding are gated until M9 (#141).
  components:
    - name: transcoder
      port: 8443
      domains: [stream.acme.com]
      resources:
        requests: { cpu: 4, memory: 8Gi }
---
apiVersion: kelson.dev/v1alpha1
kind: Environment
metadata:
  name: production
spec:
  project: streaming
  namespace: streaming
  routing:
    domainSuffix: acme.com
    gatewayClass: envoy
  components:
    - name: transcoder
      replicas: { min: 2, max: 8 }
