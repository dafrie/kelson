# A cluster running the Valkey operator kelson targets, with the served
# resources spelled out — the shape detection produces (issue #98). Both
# resources matter: valkeyclusters is the API kelson writes, valkeynodes is what
# the operator materialises the pods through, and a cluster serving only the
# first would accept this manifest and never run anything.
#
# No CloudNativePG: a cluster that can host a cache need not host a database,
# and this fixture proves the two judgements are independent.
valkey:
  version: 0.5.0
  namespace: valkey-operator-system
  crds: [valkeyclusters, valkeynodes]
