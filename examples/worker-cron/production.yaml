apiVersion: kelson.dev/v1alpha1
kind: Environment
metadata:
  name: production

spec:
  project: mailroom
  namespace: mailroom

  delivery:
    mode: direct

  # `policy: {agents: allow, require: [dry-run]}` returns with M7 (#141).

  applications:
    - name: worker
      resources:
        requests: { cpu: 100m, memory: 128Mi }
        limits: { memory: 512Mi }
