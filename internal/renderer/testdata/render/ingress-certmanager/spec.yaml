# Fixture: single web service on an ingress cluster with cert-manager.
# No gatewayClass/ingressClass in the environment: the renderer falls back to
# the detected ingress class. Hostname is derived (web.staging.acme.run).
apiVersion: kelson.dev/v1alpha1
kind: Project
metadata:
  name: hello
spec:
  image: ghcr.io/acme/hello:v1
  applications:
    - name: web
      port: 8080
      env:
        GREETING: hello
---
apiVersion: kelson.dev/v1alpha1
kind: Environment
metadata:
  name: staging
spec:
  project: hello
  routing:
    domainSuffix: staging.acme.run
