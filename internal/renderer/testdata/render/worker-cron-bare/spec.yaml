# Fixture: a bare cluster — no gateway API, no ingress class, no
# cert-manager, no prometheus. Only workloads render: a queue worker and two
# cron applications (derived from examples/worker-cron).
apiVersion: kelson.dev/v1alpha1
kind: Project
metadata:
  name: mailroom
spec:
  image: registry.acme.run/mailroom:2.0.7
  env:
    QUEUE_URL:
      from: { service: queue, key: uri }
    QUEUE_PASSWORD:
      from: { service: queue, key: password }
  services:
    - name: queue
      type: valkey
      plan: small
  applications:
    - name: worker
      command: ["mailroom", "work"]
      replicas: { min: 2 }
    - name: digest
      schedule: "30 6 * * 1-5"
      command: ["mailroom", "send-digests"]
    - name: retention-sweep
      schedule: "15 2 * * *"
      command: ["mailroom", "sweep", "--older-than=90d"]
---
apiVersion: kelson.dev/v1alpha1
kind: Environment
metadata:
  name: production
spec:
  project: mailroom
  namespace: mailroom
  delivery:
    mode: direct
  applications:
    - name: worker
      resources:
        requests: { cpu: 100m, memory: 128Mi }
        limits: { memory: 512Mi }
