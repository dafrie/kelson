{{- include "kelson.authGate" . -}}
# ClusterIP only. There is no Ingress or HTTPRoute in this chart on purpose:
# kelson-server terminates no TLS, and how you expose it is your cluster's
# routing decision, not the installer's (README.md). Reach it with
# `kubectl port-forward`, or put your own TLS-terminating proxy in front.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kelson.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kelson.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  # The component label matters: the bare selector labels are carried by the
  # controller's pods too, and a Service matching both sends a share of every
  # client's connections to a pod that does not listen on this port. The e2e
  # server smoke found it on its first run — port-forward resolved the Service
  # to the controller pod.
  selector:
    {{- include "kelson.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
